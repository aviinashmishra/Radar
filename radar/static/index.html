<style>
/* ---------- tokens ---------- */
:root{
  --bg:#f9f9f7; --surface:#fcfcfb; --surface-2:#f1f0ec; --line:#e1e0d9; --axis:#c3c2b7;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;

  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b; --up:#006300;

  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -16px rgba(0,0,0,.25);
  --r:12px; --nav:220px;
}
:root[data-theme="dark"], :root[data-theme="auto"][data-dark="1"]{
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --line:#2c2c2a; --axis:#383835;
  --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
  --accent:#3987e5; --accent-ink:#fff;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --up:#0ca30c;

  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);

/* ---------- base ---------- */
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none} a:hover{text-decoration:underline}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em} h1{font-size:22px} h2{font-size:15px} h3{font-size:13px;color:var(--ink-2)}
button,input,select{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;transition:border-color .15s,background .15s}
button:hover{border-color:var(--axis)} button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} button.ghost{border-color:transparent;background:transparent;color:var(--ink-2)} button.ghost:hover{background:var(--surface-2)}
button.sm{padding:3px 9px;font-size:12px;border-radius:6px}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px} input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)} .small{font-size:12px} .num{font-variant-numeric:tabular-nums} .right{text-align:right}
.row{display:flex;align-items:center;gap:8px} .wrap{flex-wrap:wrap} .grow{flex:1} .gap16{gap:16px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--nav) 1fr;min-height:100%}
nav{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
nav .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px;font-weight:600;font-size:15px}
nav .brand .logo{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff}
nav a.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2)} nav a.item:hover{background:var(--surface-2);text-decoration:none}
nav a.item.on{background:var(--surface-2);color:var(--ink);font-weight:500}
nav .bottom{margin-top:auto;padding:10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.live{display:inline-flex;align-items:center;gap:6px} .dot{width:7px;height:7px;border-radius:50%;background:var(--good)} .dot.off{background:var(--critical)}
.theme{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden} .theme button{border:0;border-radius:0;padding:5px 8px;background:transparent;color:var(--muted)} .theme button.on{background:var(--surface-2);color:var(--ink)}
main{min-width:0;padding:22px 28px 60px;max-width:1280px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top .sub{color:var(--muted);font-size:13px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;min-width:260px;color:var(--muted);cursor:text}
.search kbd{margin-left:auto;font:11px/1 ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:2px 5px;color:var(--muted)}
/* ---------- cards / grid ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0} .card:has(table){overflow-x:auto}
.card h2{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px} .card h2 .hint{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto}
.grid{display:grid;gap:16px} .grid>*{min-width:0} .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:2fr 1fr 1fr} .gauto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media(max-width:1500px){.g3{grid-template-columns:1fr 1fr}} @media(max-width:860px){.g2,.g3{grid-template-columns:1fr} .shell{grid-template-columns:56px 1fr} nav .brand span,nav a.item span,nav .bottom{display:none} nav a.item{justify-content:center;padding:10px} main{padding:16px}}
.empty{color:var(--muted);font-size:13px;padding:14px 0}
table{width:100%;border-collapse:collapse;font-size:13px} th{text-align:left;font-weight:500;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line)} td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top} tr:last-child td{border-bottom:0} td.num,th.num{text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;line-height:18px;white-space:nowrap}
.pill.i9{background:var(--critical);color:#fff} .pill.i7{background:var(--serious);color:#0b0b0b} .pill.i5{background:var(--warn);color:#0b0b0b} .pill.i0{background:var(--surface-2);color:var(--ink-2)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--ink-2);background:var(--surface);margin:2px 2px 2px 0}
/* action cards */
.act{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:grid;gap:6px;transition:opacity .25s}
.act.gone{opacity:.35}
.act .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)} .act .meta b{color:var(--ink);font-weight:600}
.act .t{font-weight:500;font-size:14px} .act .why{color:var(--ink-2);font-size:13px} .act .move{font-size:13px;color:var(--ink-2);padding-left:10px;border-left:2px solid var(--s3)}
.act .btns{display:flex;gap:6px;margin-top:4px}
/* feed */
.fr{display:grid;grid-template-columns:58px 28px 1fr auto;gap:10px;align-items:start;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer} .fr:hover{background:var(--surface-2)} .fr .ago{color:var(--muted);font-size:12px;padding-top:2px}
.fr>div{min-width:0;overflow-wrap:anywhere} .fr .b{font-weight:500} .fr .k{color:var(--muted);font-size:12px} .fr .x{display:none;grid-column:1/-1;padding:4px 6px 8px 96px;color:var(--ink-2);font-size:13px} .fr.open .x{display:block}
.newpill{position:sticky;top:8px;z-index:3;display:none;margin:0 auto 8px;width:max-content;background:var(--accent);color:#fff;border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer;box-shadow:var(--shadow)}
/* brand card */
.bc{display:grid;gap:8px;cursor:pointer} .bc:hover{border-color:var(--axis);text-decoration:none} .bc .n{font-weight:600;font-size:15px} .bc .stats{display:flex;gap:14px;font-size:12px;color:var(--muted)} .bc .stats b{display:block;color:var(--ink);font-size:14px;font-weight:500}
/* heatmap */
.heat td.c{text-align:center;border:2px solid var(--surface);border-radius:4px;color:#fff;min-width:46px;cursor:default;font-size:12px} .heat td.gap{outline:2px dashed var(--s2);outline-offset:-3px} .heat td.e{background:var(--surface-2);color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px;align-items:center} .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.bar{display:grid;grid-template-columns:120px 1fr 40px;gap:8px;align-items:center;margin:5px 0;font-size:13px} .bar .tr{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden} .bar .f{height:100%;background:var(--s1);border-radius:0 4px 4px 0} .bar .v{color:var(--ink-2);text-align:right}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap} .tabs button{white-space:nowrap;border:0;border-radius:0;background:transparent;color:var(--muted);padding:8px 12px;border-bottom:2px solid transparent;margin-bottom:-1px} .tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.answer{white-space:pre-wrap;font-size:13px;line-height:1.55}
.shot{display:grid;gap:4px;text-align:center;font-size:12px;color:var(--muted)} .shot img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line)}
/* tooltip, palette, toast */
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);z-index:50;display:none;max-width:300px;box-shadow:var(--shadow);white-space:pre-wrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:12vh 16px;z-index:40} .ov.on{display:flex}
.pal{width:100%;max-width:640px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;font-size:15px;background:transparent} .pal input:focus{outline:0}
.pal .res{max-height:50vh;overflow:auto} .pal .r{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:13px} .pal .r:hover,.pal .r.sel{background:var(--surface-2)} .pal .r .k{margin-left:auto;color:var(--muted);font-size:11px}
.pal .ans{padding:14px 16px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:60;display:none}
/* intel layer: KPI strip, stories, impact, market segments */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0} .kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em} .kpi .v{font-size:22px;font-weight:600;line-height:1.3;margin-top:2px;overflow-wrap:anywhere} .kpi .s{font-size:12px;color:var(--muted)}
.story{padding:10px 0;border-bottom:1px solid var(--line);display:grid;gap:5px} .story:last-child{border-bottom:0} .story .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap} .story .t{font-weight:500} .story .why{color:var(--ink-2);font-size:13px} .story .move{font-size:13px;color:var(--ink-2);padding-left:10px;border-left:2px solid var(--s3)} .story .pubs{display:flex;flex-wrap:wrap;gap:2px;align-items:center} .story .srcs{display:grid;gap:3px;padding:6px 0 0 8px;border-left:2px solid var(--line)}
.imp{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px;cursor:help} .dotc{width:8px;height:8px;border-radius:50%;flex:none}
.seg{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:4px;background:var(--surface)} .seg .big,.big{font-size:20px;font-weight:600;letter-spacing:-.01em}
.gwide{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)} @media(max-width:1100px){.gwide{grid-template-columns:1fr}}
.mini{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;min-width:48px} .mini>div{height:100%;border-radius:3px}
h3{margin-bottom:6px}
svg text{fill:var(--muted);font-size:10px}
@media(max-width:600px){.fr{grid-template-columns:auto auto 1fr} .fr>span.k{display:none} .fr .x{padding-left:6px} .search{min-width:0;flex:1} main{padding:12px} .card{padding:14px}}
/* ---------- UX layer (see static/ux.js): navigation groups, folding, sorting, collapsing, loading, motion ---------- */
nav{overflow-y:auto;scrollbar-width:thin} nav .grp{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px;user-select:none}
nav a.item{position:relative;transition:background .12s} nav a.item.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 2px 2px 0;background:var(--accent)}
@media(max-width:860px){nav .grp{height:1px;padding:0;margin:6px 8px;background:var(--line);overflow:hidden;font-size:0}}
#view .xkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
#view .xk{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:0} #view .xk .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em} #view .xk .v{font-size:22px;font-weight:600;line-height:1.3;margin-top:2px} #view .xk .s{font-size:12px;color:var(--muted)}
.card h2{font-size:14px} .card h2 .hint{font-size:11.5px}
th.ux-sort{cursor:pointer;user-select:none;transition:color .12s} th.ux-sort:hover{color:var(--ink)} th.ux-asc::after{content:" ↑";color:var(--accent)} th.ux-desc::after{content:" ↓";color:var(--accent)}
tr[data-fb]:hover td,tr[data-vb]:hover td,tr[data-go]:hover td,tr[style*="cursor:pointer"]:hover td,tr[style*="cursor: pointer"]:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.card>h2 .ux-cv{margin-left:6px;opacity:0;transition:opacity .15s,transform .15s;cursor:pointer;color:var(--muted);font-size:12px;line-height:1} .card:hover>h2 .ux-cv{opacity:1} .card.ux-collapsed>h2 .ux-cv{transform:rotate(-90deg);opacity:1}
.card.ux-collapsed>*:not(h2){display:none!important} .card.ux-collapsed>h2{margin-bottom:0}
.ux-hide{display:none!important} .ux-more{display:block;width:100%;margin-top:8px;text-align:center;color:var(--ink-2);background:var(--surface-2);border-color:transparent} .ux-more:hover{background:var(--line)}
.ux-count{display:inline-block;margin-left:6px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:10.5px;padding:0 6px;font-weight:600;vertical-align:1px}
#view.ux-in{animation:uxfade .22s ease-out} @keyframes uxfade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.skel{display:grid;gap:12px} .skel .ks{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px} .sk{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface) 50%,var(--surface-2) 75%);background-size:200% 100%;animation:sksh 1.1s linear infinite;border-radius:10px;border:1px solid var(--line)} @keyframes sksh{to{background-position:-200% 0}} .sk.k{height:66px} .sk.c{height:240px} .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:4px}
#view .empty{border:1px dashed var(--line);border-radius:10px;padding:16px;text-align:center}
.ux-top{position:fixed;right:22px;bottom:22px;z-index:30;width:38px;height:38px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:none;place-items:center;border:1px solid var(--line);font-size:16px;padding:0} .ux-top.on{display:grid}
.ux-helpbtn{width:30px;height:30px;padding:0;border-radius:50%;border:1px solid var(--line);color:var(--muted);font-weight:600} .ux-helpcard{width:100%;max-width:560px} .ux-helpcard kbd{font:11px/1 ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:2px 5px;background:var(--surface-2)}
.ux-back{color:var(--accent)}
.ux-clamp{max-height:480px;overflow:hidden;position:relative} .ux-clamp::after{content:"";position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(to bottom,transparent,var(--surface))}
.ux-count{cursor:pointer} .ux-count.on{background:var(--accent);color:#fff}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:2px solid var(--bg)} ::-webkit-scrollbar-thumb:hover{background:var(--axis)}
@media(prefers-reduced-motion:reduce){#view.ux-in,.sk{animation:none}}
@media print{nav,.top .search,#runbtn,.ux-top,.ux-helpbtn,.btns,.ux-more,.theme{display:none!important} .shell{grid-template-columns:1fr} main{max-width:none;padding:0} .card{break-inside:avoid;border-color:#ccc;box-shadow:none}}
</style>

<script>
/* ---------- utilities ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n==null?"–":Number(n).toLocaleString("en-IN",{maximumFractionDigits:0});
const inr=n=>n==null?"–":"₹"+fmt(n);
const ago=iso=>{if(!iso)return"";const d=(Date.now()-new Date(iso.match(/[Z+]/)?iso:iso+"Z"))/1000;if(d<60)return"just now";if(d<3600)return Math.floor(d/60)+"m ago";if(d<86400)return Math.floor(d/3600)+"h ago";return Math.floor(d/86400)+"d ago";};
const impc=i=>i>=9?"i9":i>=7?"i7":i>=5?"i5":"i0";
const pill=i=>`<span class="pill ${impc(i)}">${i??"–"}</span>`;
const kind=k=>String(k||"").replace(/_/g," ");
/* a GET that lands after the user has navigated on is dropped, so a slow view never paints over the current one */
let NAV=0;class Stale extends Error{}addEventListener("unhandledrejection",e=>{if(e.reason instanceof Stale)e.preventDefault();});
const api=async(p,o)=>{const n=NAV;const r=await fetch(p,o);if(!r.ok)throw new Error(p+" "+r.status);const j=await r.json();if(!o&&n!==NAV)throw new Stale();return j;};
const post=(p,b)=>api(p,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b||{})});
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",Math.max(2200,m.length*45));};
const ext=u=>u?`<a href="${esc(u)}" target="_blank" rel="noopener" class="muted" title="open"><svg class="i" style="width:13px;height:13px;vertical-align:-2px"><use href="#i-ext"/></svg></a>`:"";
let STATS=null;

/* ---------- theme ---------- */
const mq=matchMedia("(prefers-color-scheme: dark)");
function applyTheme(t){document.documentElement.dataset.theme=t;document.documentElement.dataset.dark=mq.matches?"1":"0";$$("#theme button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));try{localStorage.setItem("theme",t)}catch(e){}}
mq.addEventListener("change",()=>applyTheme(document.documentElement.dataset.theme));
$$("#theme button").forEach(b=>b.onclick=()=>applyTheme(b.dataset.t));
let savedTheme="auto";try{savedTheme=localStorage.getItem("theme")||"auto"}catch(e){} applyTheme(savedTheme);

/* ---------- charts ---------- */
function spark(series,w=120,h=28,color="var(--s1)"){const mx=Math.max(1,...series),n=series.length;const pts=series.map((v,i)=>`${(i/(n-1))*(w-4)+2},${h-2-(v/mx)*(h-6)}`).join(" ");return`<svg width="${w}" height="${h}" aria-label="activity, 14 days"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/><circle cx="${w-2}" cy="${h-2-(series[n-1]/mx)*(h-6)}" r="3" fill="${color}" stroke="var(--surface)" stroke-width="1.5"/></svg>`;}
function priceLine(hist){if(hist.length<2)return'<span class="muted small">only one snapshot so far</span>';const W=460,H=110,P=10;const ps=hist.map(h=>h.price),mn=Math.min(...ps),mx=Math.max(...ps);const y=v=>H-P-((v-mn)/(mx-mn||1))*(H-2*P-10),x=i=>P+i*(W-2*P)/(hist.length-1);return`<svg width="${W}" height="${H}" role="img" aria-label="price history"><line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="var(--line)"/><polyline points="${hist.map((h,i)=>`${x(i)},${y(h.price)}`).join(" ")}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>${hist.map((h,i)=>`<circle cx="${x(i)}" cy="${y(h.price)}" r="4" fill="${h.available?"var(--s1)":"var(--s8)"}" stroke="var(--surface)" stroke-width="2"><title>${h.seen_at.slice(0,16).replace("T"," ")} ${inr(h.price)}${h.available?"":" · out of stock"}</title></circle>`).join("")}<text x="${P}" y="${H-1}">${inr(mn)}</text><text x="${W-70}" y="${H-1}">${inr(mx)}</text></svg>`;}
function ring(rows){const W=420,H=284,cx=W/2,cy=H/2,R=112,r0=28,dOf=s=>r0+(1-Math.min(100,Math.max(0,s))/100)*(R-12-r0);
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:480px;display:block;margin:0 auto" role="img" aria-label="threat radar">`;[R,dOf(50),dOf(80)].forEach(r=>g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)"/>`);
  /* angle fixed per brand (alphabetical), distance from P = quietness; overlapping dots are nudged apart sideways */
  const n=rows.length||1,P=[...rows].sort((a,b)=>a.brand.localeCompare(b.brand,undefined,{sensitivity:"base"})).map((r,k)=>({r,a:-Math.PI/2+(k+.5)*2*Math.PI/n,d:dOf(r.score),s:5+Math.min(r.events_7d,30)/7.5}));
  for(let it=0,hit=1;it<150&&hit;it++){hit=0;for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const p=P[i],q=P[j],over=p.s+q.s+3-Math.hypot(Math.cos(q.a)*q.d-Math.cos(p.a)*p.d,Math.sin(q.a)*q.d-Math.sin(p.a)*p.d);if(over>0){hit=1;const dir=Math.sin(q.a-p.a)>=0?1:-1;p.a-=dir*(over/2+.5)/p.d;q.a+=dir*(over/2+.5)/q.d;}}}
  /* names sit outside the ring in two columns, stacked so they never collide, joined to their dot by a leader line */
  const lab=P.map(p=>({p,side:Math.cos(p.a)>=0?1:-1,y:cy+Math.sin(p.a)*(R+6)}));
  [1,-1].forEach(sd=>{const s=lab.filter(l=>l.side===sd).sort((a,b)=>a.y-b.y);s.forEach((l,i)=>l.y=Math.max(l.y,i?s[i-1].y+17:10));for(let i=s.length-1;i>=0;i--)s[i].y=Math.min(s[i].y,i<s.length-1?s[i+1].y-17:H-8);});
  lab.forEach(l=>l.x=cx+l.side*(Math.sqrt(Math.max(0,(R+14)**2-(l.y-cy)**2))+8));
  const pt=(a,r)=>`${(cx+Math.cos(a)*r).toFixed(1)},${(cy+Math.sin(a)*r).toFixed(1)}`;
  g+=`<g fill="none" stroke="var(--axis)" stroke-width="1">${lab.map(({p,x,y,side})=>`<polyline points="${pt(p.a,p.d+p.s+2)} ${pt(p.a,R+6)} ${(x-side*3).toFixed(1)},${y.toFixed(1)}"/>`).join("")}</g>`;
  g+=`<circle cx="${cx}" cy="${cy}" r="12" fill="var(--accent)"/><text x="${cx}" y="${cy+4}" text-anchor="middle" style="fill:#fff;font-weight:600">P</text>`;
  lab.forEach(({p,x,y,side})=>{const r=p.r,col=r.score>=80?"var(--s2)":r.score>=50?"var(--s4)":"var(--s1)",nm=r.brand.length>14?r.brand.slice(0,13)+"…":r.brand;
    g+=`<g class="rb" data-brand="${esc(r.brand)}" data-tip="${esc(r.brand)} · score ${r.score}\n${r.events_7d} events, ${r.signals_7d} signals, launch ${r.launch}\n${esc(r.why.join("\n"))}" style="cursor:pointer"><circle cx="${(cx+Math.cos(p.a)*p.d).toFixed(1)}" cy="${(cy+Math.sin(p.a)*p.d).toFixed(1)}" r="${p.s.toFixed(1)}" fill="${col}" stroke="var(--surface)" stroke-width="2"/><text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${side>0?"start":"end"}" style="fill:var(--ink-2);font-size:12px${r.score>=50?";font-weight:600":""}">${esc(nm)}</text></g>`;});
  g+="</svg>";
  g+=`<div style="margin-top:10px">${rows.slice(0,5).map((r,i)=>`<a class="row small" style="padding:4px 0;border-bottom:1px solid var(--line)" href="#/brand/${encodeURIComponent(r.brand)}"><span class="muted num" style="width:14px">${i+1}</span><b>${esc(r.brand)}</b><span class="grow muted">${r.events_7d} events · launch ${r.launch}${r.signals_7d?` · ${r.signals_7d} signals`:""}</span><span class="num ink2">${r.score}</span></a>`).join("")}</div>`;
  return g;}
/* ---------- live updates: a stream on the local server, a one-minute poll in cloud mode ---------- */
let unseen=[],SEEN=new Set(),es,PA=0,PS=0;
function onEvent(e){if(SEEN.has(e.id))return;SEEN.add(e.id);unseen.push(e);const p=$("#newpill");if(p){p.style.display="block";p.textContent=`${unseen.length} new · click to show`;}else if(route()==="today"){scheduleRefresh();}}
function onSignal(){if(route()==="today")scheduleRefresh();}
/* cloud mode: the indicator shows how old the snapshot is (GitHub Actions publishes one every ~15 min) */
function liveState(){const h=STATS&&STATS.hosted;if(!h)return;const at=h.published_at,hrs=at?(Date.now()-new Date(at))/36e5:99;
  $("#dot").classList.toggle("off",!at||hrs>2||!!h.error);$("#livetxt").textContent=at?`cloud · updated ${ago(at)}`:"cloud · waiting for data";
  $("#livetxt").title=h.error||"Data from the GitHub Actions worker"+(h.tier?` (last run: ${h.tier} tier)`:"");}
async function poll(){try{const u=await api(`/api/updates?after_id=${PA}&after_sig=${PS}`);if(PA){u.events.forEach(onEvent);if(u.signals.length)onSignal();}PA=u.after_id;PS=u.after_sig;}catch(e){}}
function connect(){if(STATS&&STATS.hosted){liveState();poll();setInterval(poll,60000);return;}
  es=new EventSource("/api/stream");es.onopen=()=>{$("#dot").classList.remove("off");$("#livetxt").textContent="live";};es.onerror=()=>{$("#dot").classList.add("off");$("#livetxt").textContent="reconnecting";};
  es.addEventListener("event",m=>onEvent(JSON.parse(m.data)));
  es.addEventListener("signal",onSignal);}
let rt;function scheduleRefresh(){clearTimeout(rt);rt=setTimeout(()=>render(),2500);}
/* cloud mode serves a read-only snapshot, so Done / Later is remembered in this browser (two weeks) */
const TRI={all(){try{return JSON.parse(localStorage.getItem("triage")||"{}")}catch(e){return{}}},
  add(k){const t=this.all(),now=Date.now();for(const x in t)if(now-t[x]>14*864e5)delete t[x];t[k]=now;try{localStorage.setItem("triage",JSON.stringify(t))}catch(e){}}};
const isOpen=(kind,id)=>!(STATS&&STATS.hosted&&TRI.all()[kind+id]);

/* ---------- router ---------- */
const route=()=>(location.hash.replace(/^#\/?/,"")||"today").split("/")[0];
const param=()=>decodeURIComponent((location.hash.replace(/^#\/?/,"").split("/")[1]||""));
window.addEventListener("hashchange",render);
async function render(){const r=route();NAV++;$$("#nav a.item").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#/"+r));const v=$("#view");v.innerHTML='<div class="skel"><div class="ks"><div class="sk k"></div><div class="sk k"></div><div class="sk k"></div><div class="sk k"></div></div><div class="sk c"></div><div class="sk c" style="height:140px"></div><span class="sr">Loading…</span></div>';
  try{STATS=STATS||await api("/api/stats");const lr=STATS.last_runs.fast||STATS.last_runs.all;$("#sweep").textContent=lr?`stores swept ${ago(lr.at)}`:"no sweep yet";
    await ({today:vToday,feed:vFeed,news:vNews,financials:vFinancials,brands:vBrands,brand:vBrand,segments:vSegments,segment:vSegments,pricing:vPricing,market:vMarket,briefs:vBriefs,channels:(...a)=>vChannels(...a),voice:(...a)=>vVoice(...a),regions:(...a)=>vRegions(...a),reports:(...a)=>vReports(...a),strategy:(...a)=>vStrategy(...a),settings:vSettings}[r]||vToday)(v);}
  catch(e){if(e instanceof Stale)return;const is404=/ 404$/.test(e.message);v.innerHTML=`<div class="card"><b>Could not load.</b><div class="muted small">${esc(e.message)}</div>${is404?`<div class="small" style="margin-top:8px">This route is missing on the running server, which usually means the server started before the radar was updated. ${STATS&&STATS.hosted?"In cloud mode, push the update so Vercel redeploys.":'<button class="sm" data-restart>Restart the server</button>'}</div>`:""}</div>`;}
  buildBanner();}
function head(t,s){$("#title").textContent=t;$("#subtitle").innerHTML=s||"";}
/* the server reports whether the code on disk is newer than the process serving it; offer a one-click restart */
function buildBanner(){const b=STATS&&STATS.build;let el=$("#buildbar");if(!b||!b.stale||b.hosted){if(el)el.remove();return;}
  if(!el){el=document.createElement("div");el.id="buildbar";el.className="card";el.style.cssText="border-color:var(--s4);margin-bottom:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap";$("#view").parentNode.insertBefore(el,$("#view"));}
  el.innerHTML=`<span><b>The radar was updated</b> <span class="muted small">the running server is older than the files on disk, so new pages and sources can 404</span></span><span class="grow"></span><button class="sm" data-restart>Restart the server</button>`;}
async function restartServer(btn){btn.disabled=true;btn.textContent="Restarting…";let r;try{r=await post("/api/restart");}catch(e){toast(/ 404$/.test(e.message)?"This server is too old to restart itself: close its window and run start.bat (or python -m radar.server) once; from then on this button works.":"Restart failed: "+e.message,9000);btn.disabled=false;btn.textContent="Restart the server";return;}
  if(!r.ok){toast(r.message||"Not restarted");btn.disabled=false;btn.textContent="Restart the server";return;}toast(r.message);const old=r.pid;const t0=Date.now();
  const tick=async()=>{try{const h=await fetch("/api/health",{cache:"no-store"});if(h.ok){const s=await (await fetch("/api/stats",{cache:"no-store"})).json();if(s.build&&s.build.pid!==old){toast("Server is back on the new build");location.reload();return;}}}catch(e){}
    if(Date.now()-t0>90000){toast("The server has not come back in 90 s: start it by hand (python -m radar.server or start.bat)");return;}setTimeout(tick,1500);};setTimeout(tick,2500);}
document.addEventListener("click",e=>{const b=e.target.closest("[data-restart]");if(b)restartServer(b);});

/* ---------- views ---------- */
function actCard(e,isSignal){const id=e.id;return`<div class="act" data-id="${id}" data-kind="${isSignal?"signal":"event"}">
  <div class="meta">${pill(e.importance)}<b>${esc(e.brand)}</b><span>${esc(kind(e.kind))}</span><span style="margin-left:auto">${ago(e.created_at)}</span></div>
  <div class="t">${esc(e.title)} ${ext(e.url)}</div>
  ${e.so_what&&!e.so_what.includes(e.title.slice(0,40))?`<div class="why">${esc(e.so_what)}</div>`:isSignal&&e.detail?`<div class="why">${esc(e.detail.slice(0,300))}</div>`:""}
  ${impLine(e)}${e.counter_move&&e.counter_move!=="No action"?`<div class="move">${esc(e.counter_move)}</div>`:""}
  <div class="btns"><button class="sm" data-st="done"><span class="row"><svg class="i" style="width:13px;height:13px"><use href="#i-check"/></svg> Done</span></button><button class="sm ghost" data-st="snoozed"><span class="row"><svg class="i" style="width:13px;height:13px"><use href="#i-clock"/></svg> Later</span></button>${e.brand&&!isSignal?`<a class="muted small" style="margin-left:auto;align-self:center" href="#/brand/${encodeURIComponent(e.brand)}">brand page →</a>`:""}</div></div>`;}
function bindActs(root){root.querySelectorAll(".act [data-st]").forEach(b=>b.onclick=async()=>{const c=b.closest(".act");const r=await post(`/api/${c.dataset.kind}s/${c.dataset.id}/status`,{status:b.dataset.st});if(r.scope==="browser")TRI.add(c.dataset.kind+c.dataset.id);c.classList.add("gone");setTimeout(()=>c.remove(),400);toast((b.dataset.st==="done"?"Marked done":"Snoozed")+(r.scope==="browser"?" · remembered in this browser":""));});}

async function vTodayClassic(v){const d=await api("/api/today");const dt=new Date();d.actions=d.actions.filter(e=>isOpen("event",e.id));d.signals=d.signals.filter(s=>isOpen("signal",s.id));head("Today",`${dt.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"})}${d.festival?` · ${esc(d.festival[0])} in ${d.festival[1]} days`:""}${d.last_sweep?` · stores swept ${ago(d.last_sweep.at)}`:""}`);
  const radar=(await api("/api/radar")).slice(0,18);
  v.innerHTML=`<div class="grid g3">
    <div style="display:grid;gap:16px;align-content:start">
      <div class="card"><h2>Act on <span class="hint">${d.actions.length} open · ${d.done_7d} done this week</span></h2><div id="acts" style="display:grid;gap:10px">${d.actions.map(e=>actCard(e,false)).join("")||'<div class="empty">Nothing urgent. The radar will add cards here as rivals move.</div>'}</div></div>
      <div class="card"><h2>Signals <span class="hint">cross-event rules</span></h2><div id="sigs" style="display:grid;gap:10px">${d.signals.map(s=>actCard(s,true)).join("")||'<div class="empty">No open signals.</div>'}</div></div>
    </div>

/* ---------- segments: price ladder per form factor ---------- */
function ladderSvg(rows){const pts=rows.filter(r=>r.price);if(!pts.length)return'<div class="empty">No priced products yet.</div>';
  const W=900,L=30,R=30,STEP=13,RAD=5;const mn=Math.min(...pts.map(r=>r.price)),mx=Math.max(...pts.map(r=>r.price));const lx=v=>Math.log10(v),x=v=>L+(lx(v)-lx(mn))/((lx(mx)-lx(mn))||1)*(W-L-R);
  const ticks=[500,1000,2000,3000,5000,10000,20000,30000,40000].filter(t=>t>=mn&&t<=mx);
  // stack dots that collide; chart height follows the tallest stack so dots never run into the label band
  const placed=[];pts.forEach(r=>{const px=x(r.price);let lane=0;while(placed.some(p=>p.lane===lane&&Math.abs(p.x-px)<STEP))lane++;placed.push({r,x:px,lane});});
  const lanes=Math.max(...placed.map(p=>p.lane))+1;
  // Pebble labels: greedy, non-overlapping, in up to 3 rows above the stacks. Anything that does not fit goes to the strip below.
  const clean=n=>n.replace(/^Pebble /,"").replace(/™|®/g,"").replace(/\s*[|(-].*$/,"").trim();
  const mine=pts.filter(r=>r.self).sort((a,b)=>a.price-b.price);const labels=[],rowsUsed=[[],[],[]],seen=new Set();
  mine.forEach(r=>{const name=clean(r.name).slice(0,16);const k=name.toLowerCase()+"|"+Math.round(r.price/100);if(!name||seen.has(k))return;
    const px=x(r.price),w=name.length*6.2+10,x0=Math.max(L,Math.min(W-R-w,px-w/2)),x1=x0+w;
    const row=rowsUsed.findIndex(rw=>rw.every(([a,b])=>x1<a-4||x0>b+4));if(row<0)return;
    rowsUsed[row].push([x0,x1]);seen.add(k);labels.push({name,px,cx:x0+w/2,row});});
  const nRows=labels.length?Math.max(...labels.map(l=>l.row))+1:0;const top=10+nRows*14;const axisY=top+lanes*STEP+18;const H=axisY+28;
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="price ladder" style="display:block"><line x1="${L}" x2="${W-R}" y1="${axisY}" y2="${axisY}" stroke="var(--axis)"/>`;
  ticks.forEach(t=>g+=`<line x1="${x(t)}" x2="${x(t)}" y1="${axisY-4}" y2="${axisY+4}" stroke="var(--axis)"/><text x="${x(t)}" y="${axisY+18}" text-anchor="middle">₹${fmt(t)}</text>`);
  placed.forEach(({r,x:px,lane})=>{const cy=axisY-10-lane*STEP;const fill=r.self?"var(--accent)":r.source==="watchlist"?"var(--s2)":"var(--s1)";const hollow=/sold|upcoming|limited|pre/i.test(r.status||"");
    g+=`<g data-tip="${esc(r.brand)} · ${esc(r.name)}\n₹${fmt(r.price)}${r.subscription&&r.subscription!=="None"?" · "+esc(r.subscription)+" subscription":""}${r.status?" · "+esc(r.status):""}${r.evidence?"\nevidence: "+esc(r.evidence):""}"><circle cx="${px}" cy="${cy}" r="${r.self?RAD+1:RAD}" fill="${hollow?"var(--surface)":fill}" stroke="${fill}" stroke-width="2"/></g>`;});
  const stackTop=px=>{const l=placed.filter(p=>Math.abs(p.x-px)<STEP).reduce((m,p)=>Math.max(m,p.lane),0);return axisY-10-l*STEP-RAD-2;};
  labels.forEach(l=>{const ly=top-4-(nRows-1-l.row)*14;g+=`<line x1="${l.px}" x2="${l.px}" y1="${ly+3}" y2="${stackTop(l.px)}" stroke="var(--accent)" stroke-opacity=".35"/><text x="${l.cx}" y="${ly}" text-anchor="middle" style="fill:var(--accent);font-weight:600">${esc(l.name)}</text>`;});
  g+="</svg>";
  // Pebble strip: every own SKU in price order, so nothing is lost when the chart cannot label it
  const strip=mine.map(r=>`<span class="chip" style="border-color:var(--accent);color:var(--accent)" title="${esc(r.name)}">${esc(clean(r.name).slice(0,22))} ₹${fmt(r.price)}</span>`).join("");
  return g+(strip?`<div class="hint" style="margin-top:8px">Pebble on this ladder</div><div>${strip}</div>`:"");}

/* ---------- command palette ---------- */
const ov=$("#ov"),palq=$("#palq"),palres=$("#palres"),palans=$("#palans");let sel=0;
function openPal(){ov.classList.add("on");palq.value="";palans.style.display="none";palRender();setTimeout(()=>palq.focus(),0);}
function closePal(){ov.classList.remove("on");}
function palItems(q){const Q=q.toLowerCase().trim();const pages=[["Today","#/today"],["Feed","#/feed"],["News","#/news"],["Financials","#/financials"],["Brands","#/brands"],["Segments","#/segments"],["Pricing","#/pricing"],["Market","#/market"],["Channels","#/channels"],["Reviews","#/voice"],["Regions","#/regions"],["Reports","#/reports"],["Strategy","#/strategy"],["Briefs","#/briefs"],["Settings","#/settings"]];const it=[];
  (STATS?STATS.brands:[]).filter(b=>!Q||b.name.toLowerCase().includes(Q)).slice(0,6).forEach(b=>it.push({l:b.name,k:"brand",go:()=>{location.hash="#/brand/"+encodeURIComponent(b.name);closePal();}}));
  pages.filter(p=>!Q||p[0].toLowerCase().includes(Q)).forEach(p=>it.push({l:p[0],k:"page",go:()=>{location.hash=p[1];closePal();}}));
  /* one word that names a brand or page jumps there on Enter; anything question-like asks the radar first */
  if(Q){const first=/\s/.test(Q)||!it.length;const a={l:`Ask the radar: “${q}”`,k:first?"Enter":"ask",go:()=>ask(q)};first?it.unshift(a):it.push(a);}
  if(Q)it.push({l:`Search feed for “${q}”`,k:"feed",go:()=>{sessionStorage.setItem("feedf",JSON.stringify({q}));location.hash="#/feed";if(route()==="feed")render();closePal();}});
  return it;}
let items=[];function palRender(){items=palItems(palq.value);sel=Math.min(sel,items.length-1);palres.innerHTML=items.map((i,n)=>`<div class="r ${n===sel?"sel":""}" data-n="${n}">${esc(i.l)}<span class="k">${esc(i.k)}</span></div>`).join("");palres.querySelectorAll(".r").forEach(r=>r.onclick=()=>items[+r.dataset.n].go());}
async function ask(q){palans.style.display="block";palans.textContent="Thinking…";try{const r=await post("/api/chat",{question:q});palans.textContent=r.answer+(r.mode==="keyword"?"\n\n(keyword mode: add GEMINI_API_KEY or ANTHROPIC_API_KEY for full answers)":r.mode==="locked"?"\n\n"+r.note:"");}catch(e){palans.textContent="Failed: "+e.message;}}
palq.oninput=()=>{sel=0;palRender();};palq.onkeydown=e=>{if(e.key==="ArrowDown"){sel=Math.min(sel+1,items.length-1);palRender();e.preventDefault();}else if(e.key==="ArrowUp"){sel=Math.max(sel-1,0);palRender();e.preventDefault();}else if(e.key==="Enter"){items[sel]?.go();}else if(e.key==="Escape")closePal();};
ov.onclick=e=>{if(e.target===ov)closePal();};$("#searchbtn").onclick=openPal;
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPal();}else if(e.key==="/"&&!/input|textarea|select/i.test(e.target.tagName)){e.preventDefault();openPal();}else if(e.key==="Escape")closePal();});

/* ---------- feed rows expand on click (one delegated listener) ---------- */
document.addEventListener("click",e=>{const r=e.target.closest(".fr");if(r&&!e.target.closest("a,button"))r.classList.toggle("open");});
/* ---------- tooltips, run button ---------- */
document.addEventListener("mousemove",e=>{const t=e.target.closest("[data-tip]"),tip=$("#tip");if(!t){tip.style.display="none";return;}tip.textContent=t.dataset.tip;tip.style.display="block";tip.style.left=Math.min(e.clientX+14,innerWidth-320)+"px";tip.style.top=(e.clientY+14)+"px";});
$("#runbtn").onclick=async()=>{const r=await post("/api/run?tier=fast");toast(r.message||(r.busy?"A sweep is already running; this one was not started":"Store sweep started · results land in a couple of minutes"));};
setInterval(async()=>{try{STATS=await api("/api/stats");const lr=STATS.last_runs.fast||STATS.last_runs.all;$("#sweep").textContent=lr?`stores swept ${ago(lr.at)}`:"";liveState();}catch(e){}},60000);

<script id="radar-intel">
/* ---------- intel layer: news, financials, market size, impact ---------- */
const cr=n=>n==null?"–":Math.abs(n)>=1e7?"₹"+(n/1e7).toLocaleString("en-IN",{maximumFractionDigits:1})+" cr":Math.abs(n)>=1e5?"₹"+(n/1e5).toLocaleString("en-IN",{maximumFractionDigits:1})+" L":"₹"+fmt(n);
const money=(v,cur,unit)=>{if(v==null)return"–";if(cur==="INR")return unit==="crore"?"₹"+fmt(v)+" cr":"₹"+fmt(v);const sym=cur==="USD"?"$":cur==="EUR"?"€":cur+" ";return Math.abs(v)>=1000?sym+(v/1000).toLocaleString("en-IN",{maximumFractionDigits:2})+"B":sym+fmt(v)+"M";};
const pct=v=>v==null?"–":(v>0?"+":"")+Number(v).toFixed(1)+"%";
const sgn=v=>v>0?"var(--up)":v<0?"var(--s8)":"var(--muted)";
const CONF={filing:["filing","var(--good)"],reported:["reported","var(--s1)"],ai:["AI-extracted","var(--s7)"],extracted:["from news","var(--s4)"],estimate:["estimate","var(--muted)"]};
const confChip=c=>{const [l,col]=CONF[c]||[c||"–","var(--muted)"];return`<span class="chip" style="border-color:${col};color:${col}">${esc(l)}</span>`;};
const TCOL={launch:"var(--s3)",funding:"var(--s7)",financials:"var(--s7)",pricing:"var(--s2)",legal:"var(--s8)",leadership:"var(--s4)",partnership:"var(--s1)",distribution:"var(--s1)",manufacturing:"var(--s6)",marketing:"var(--s5)",market_data:"var(--seq1)",reviews:"var(--muted)",general:"var(--muted)"};
const topicChip=t=>`<span class="chip" style="border-color:${TCOL[t]||"var(--line)"};color:${TCOL[t]||"var(--ink-2)"}">${esc(kind(t||"general"))}</span>`;
const kpi=(label,value,sub,color)=>`<div class="kpi"><div class="l">${label}</div><div class="v num" style="${color?"color:"+color:""}">${value}</div>${sub?`<div class="s">${sub}</div>`:""}</div>`;
function bars(rows,o={}){const label=o.label||(r=>r.label),value=o.value||(r=>r.value),fv=o.fmtv||(v=>fmt(v)),color=o.color||(()=>"var(--s1)");const mx=o.max||Math.max(1,...rows.map(value));return rows.map(r=>`<div class="bar"><span title="${esc(label(r))}">${o.link?`<a href="${o.link(r)}">${esc(label(r))}</a>`:esc(label(r))}</span><div class="tr"><div class="f" style="width:${Math.max(1,value(r)/mx*100)}%;background:${color(r)}"></div></div><span class="v">${fv(value(r))}</span></div>`).join("")||'<div class="empty">Nothing yet.</div>';}
function colChart(series,o={}){const w=o.w||380,h=o.h||130,fv=o.fmtv||(v=>fmt(v)),color=o.color||"var(--s1)";if(!series.length)return'<div class="empty">No series yet.</div>';const P=24,n=series.length,bw=Math.min(46,(w-2*P)/n-8);const mx=Math.max(0,...series.map(s=>s.value)),mn=Math.min(0,...series.map(s=>s.value));const y=v=>P+(mx-v)/((mx-mn)||1)*(h-2*P-14);const y0=y(0);
  let g=`<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;display:block" role="img" aria-label="${esc(o.label||"series")}"><line x1="${P}" x2="${w-P}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="var(--axis)"/>`;
  series.forEach((s,i)=>{const x=P+(i+.5)*(w-2*P)/n-bw/2,yv=y(s.value),top=Math.min(yv,y0),hh=Math.abs(yv-y0);g+=`<g data-tip="${esc(s.label)}: ${esc(fv(s.value))}${s.conf?" · "+esc(s.conf):""}"><rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,hh).toFixed(1)}" rx="3" fill="${s.value<0?"var(--s8)":s.color||color}" ${s.conf==="estimate"?'fill-opacity=".45"':""}/><text x="${(x+bw/2).toFixed(1)}" y="${h-4}" text-anchor="middle">${esc(s.label)}</text><text x="${(x+bw/2).toFixed(1)}" y="${(top-4).toFixed(1)}" text-anchor="middle" style="fill:var(--ink-2)">${esc(fv(s.value))}</text></g>`;});
  return g+"</svg>";}
function lineChart(vals,o={}){const w=o.w||380,h=o.h||90,color=o.color||"var(--s1)";if(!vals||vals.length<2)return'<span class="muted small">not enough points yet</span>';const P=8;const mn=Math.min(...vals),mx=Math.max(...vals);const x=i=>P+i*(w-2*P)/(vals.length-1),y=v=>h-P-((v-mn)/((mx-mn)||1))*(h-2*P-12);const pts=vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return`<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;display:block" role="img"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/><circle cx="${x(vals.length-1).toFixed(1)}" cy="${y(vals[vals.length-1]).toFixed(1)}" r="3" fill="${color}"/><text x="${P}" y="${h-1}">${esc(o.l0||"")}</text><text x="${w-P}" y="${h-1}" text-anchor="end">${esc(o.l1||"")}</text></svg>`;}
const impLine=e=>{const i=e&&e.data&&e.data.impact;return i?`<div class="imp" data-tip="${esc(i.basis)}\n\nModel: config/market.yaml (Pebble revenue, segment mix, elasticity). An estimate, not a measurement."><span class="dotc" style="background:${i.direction==="risk"?"var(--s8)":"var(--good)"}"></span>${esc(i.label)}<span class="muted"> · ${esc(i.segment)}</span></div>`:"";};
const storyCard=(s,opts={})=>`<div class="story" data-sid="${s.ids[0]}"><div class="meta">${pill(s.importance)}${opts.noBrand?"":`<a href="#/brand/${encodeURIComponent(s.brand)}"><b>${esc(s.brand)}</b></a>`}${topicChip(s.topic)}<span class="muted">${s.n_sources} ${s.n_sources===1?"outlet":"outlets"}</span><span style="margin-left:auto" class="muted">${ago(s.last_seen)}</span></div>
  <div class="t">${esc(s.title)} ${ext(s.sources[0]&&s.sources[0].url)}</div>
  ${s.so_what&&!s.so_what.includes(s.title.slice(0,40))?`<div class="why">${esc(s.so_what)}</div>`:""}${impLine({data:{impact:s.impact}})}${s.counter_move&&s.counter_move!=="No action"?`<div class="move">${esc(s.counter_move)}</div>`:""}
  <div class="pubs">${s.publishers.slice(0,6).map(p=>`<span class="chip">${esc(p)}</span>`).join("")}<button class="sm ghost" data-src>details</button></div>
  <div class="srcs" style="display:none">${s.summary?`<div class="small ink2" style="margin:6px 0">${esc(s.summary)}</div>`:""}
   <div class="small muted" style="margin:4px 0">first seen ${ago(s.first_seen)} · last ${ago(s.last_seen)} · ${s.n_sources} outlet${s.n_sources===1?"":"s"} via ${(s.providers||[]).join(", ")}${s.category?` · ${esc(kind(s.category))}`:""}</div>
   ${s.sources.map(x=>`<div class="small"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a> <span class="muted">${esc(x.publisher)} · ${esc(x.published)} · ${esc(x.provider)}</span></div>`).join("")}
   ${s.brand&&s.brand!=="Sector"?`<div class="row wrap small" style="margin-top:8px;gap:10px"><a href="#/brand/${encodeURIComponent(s.brand)}">${esc(s.brand)} brand page →</a><a href="#/news?brand=${encodeURIComponent(s.brand)}" data-nb="${esc(s.brand)}">all ${esc(s.brand)} stories →</a><a href="#/financials/${encodeURIComponent(s.brand)}">financials →</a><a href="https://www.google.com/search?q=${encodeURIComponent(s.title)}" target="_blank" rel="noopener">search the web ↗</a></div>`:""}</div></div>`;
document.addEventListener("click",e=>{const b=e.target.closest("[data-src]");if(b){const s=b.closest(".story").querySelector(".srcs");s.style.display=s.style.display==="none"?"":"none";b.textContent=s.style.display==="none"?"details":"hide";}
  const nb=e.target.closest("[data-nb]");if(nb){e.preventDefault();sessionStorage.setItem("newsf",JSON.stringify({brand:nb.dataset.nb,days:60}));location.hash="#/news";if(route()==="news")render();}});
/* one collector on demand (News / Financials refresh buttons); polls until the run finishes, then re-renders */
const lastRunLine=lr=>lr&&lr.at?`refreshed ${ago(lr.at)}${lr.added!=null?` · ${lr.added} new`:""}${lr.state==="failed"?" · failed":""}`:lr&&lr.state==="running"?"refreshing…":"";
async function collectNow(name,btn){btn.disabled=true;const label=btn.textContent;let r;try{r=await post("/api/collect/"+name);}catch(e){toast("Could not start: "+e.message);btn.disabled=false;return;}
  if(r.state!=="running"){toast(r.message||(r.state==="dispatched"?"Cloud worker dispatched; the snapshot updates when it finishes.":"Not started: "+r.state));btn.disabled=false;return;}
  toast(`Collecting ${name}… a few minutes`);const t0=Date.now();const tick=async()=>{let st;try{st=await api("/api/collect/"+name,{});}catch(e){st={state:"failed",error:e.message};}
    if(st.state==="running"&&Date.now()-t0<12*60*1000){btn.textContent=`refreshing… ${Math.round((Date.now()-t0)/1000)}s`;setTimeout(tick,5000);return;}
    btn.disabled=false;btn.textContent=label;toast(st.state==="done"?`${name}: ${st.added} new in ${st.seconds}s`:`${name}: ${st.state||"timed out"}${st.error?" · "+st.error:""}`);if(st.state==="done")render();};setTimeout(tick,5000);}

/* ---------- Today: KPI strip, actions with ₹ impact, pressure, stories, listed movers ---------- */
async function vToday(v){const d=await api("/api/today");const dt=new Date();d.actions=d.actions.filter(e=>isOpen("event",e.id));d.signals=d.signals.filter(s=>isOpen("signal",s.id));head("Today",`${dt.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long"})}${d.festival?` · ${esc(d.festival[0])} in ${d.festival[1]} days`:""}${d.last_sweep?` · stores swept ${ago(d.last_sweep.at)}`:""}`);
  const radar=(await api("/api/radar")).slice(0,18);const k=d.kpis||{};
  v.innerHTML=`<div class="kpis">${kpi("Open actions",d.actions.length,`${d.done_7d} done this week`)}${kpi("Changes 24h",fmt(k.events_24h),"every sensor")}${kpi("News 7d",fmt(k.stories_7d),"articles, two aggregators")}${kpi("At risk, 30d",cr(k.risk_30d)+"<span class='small muted'>/mo</span>",`upside ${cr(k.upside_30d)}/mo · model`,k.risk_30d>0?"var(--s8)":"")}${kpi("Money moves 7d",fmt(k.money_7d),"filings, facts, shares")}${kpi("On the shelf",fmt(k.listings_live||0),`<a href="#/channels">Pebble live in ${k.pebble_qc_cities||0} q-commerce cities</a>`)}${kpi("Buyer voice 7d",fmt(k.voice_7d||0),`<a href="#/voice">${k.voice_neg_7d||0}% negative</a>`)}${kpi(d.festival?esc(d.festival[0].split(" / ")[0]):"Next sale",d.festival?`${d.festival[1]}<span class='small muted'> days</span>`:"–","sale calendar")}</div>
  <div class="grid gwide">
    <div style="display:grid;gap:16px;align-content:start">
      <div class="card"><h2>Act on <span class="hint">${d.actions.length} open · ${d.done_7d} done this week</span></h2><div id="acts" style="display:grid;gap:10px">${d.actions.map(e=>actCard(e,false)).join("")||'<div class="empty">Nothing urgent. The radar will add cards here as rivals move.</div>'}</div></div>
      <div class="card"><h2>Signals <span class="hint">cross-event rules</span></h2><div id="sigs" style="display:grid;gap:10px">${d.signals.map(s=>actCard(s,true)).join("")||'<div class="empty">No open signals.</div>'}</div></div>
    </div>
    <div style="display:grid;gap:16px;align-content:start">
      <div class="card"><h2>Threat radar <span class="hint">7 days</span></h2>${ring(radar)}<div class="legend"><span><i style="background:var(--s2)"></i>hot</span><span><i style="background:var(--s4)"></i>active</span><span><i style="background:var(--s1)"></i>quiet</span><span>· size = events · nearer P = hotter</span></div></div>
      <div class="card"><h2>Changed in 24h</h2>${d.by_brand.length?d.by_brand.slice(0,12).map(b=>`<a class="row" style="padding:7px 0;border-bottom:1px solid var(--line)" href="#/brand/${encodeURIComponent(b.brand)}"><b style="min-width:92px">${esc(b.brand)}${b.self?' <span class="muted small">you</span>':""}</b><span class="grow small ink2">${Object.entries(b.kinds).sort((a,c)=>c[1]-a[1]).slice(0,3).map(([k,c])=>`${c} ${kind(k)}`).join(" · ")}</span>${pill(b.max_importance)}</a>`).join(""):'<div class="empty">Quiet day so far.</div>'}</div>
      <div class="card"><h2>Pressure on Pebble <span class="hint">₹/month · 30 days · <a href="#/market">model</a></span></h2>${bars(d.pressure_top||[],{label:r=>r.brand,value:r=>r.risk+r.upside,fmtv:cr,color:r=>r.risk>=r.upside?"var(--s8)":"var(--good)",link:r=>"#/brand/"+encodeURIComponent(r.brand)})}<div class="legend"><span><i style="background:var(--s8)"></i>mostly risk</span><span><i style="background:var(--good)"></i>mostly upside</span></div></div>
    </div>
  </div>
  <div class="grid g2" style="margin-top:16px">
    <div class="card"><h2>Stories this week <span class="hint"><a href="#/news">all news →</a></span></h2>${(d.stories||[]).map(s=>storyCard(s)).join("")||'<div class="empty">No news clustered yet.</div>'}</div>
    <div class="card"><h2>Listed rivals <span class="hint">share-price moves · <a href="#/financials">financials →</a></span></h2>${(d.movers||[]).length?d.movers.map(e=>`<div class="act"><div class="meta">${pill(e.importance)}<b>${esc(e.brand)}</b><span>${ago(e.created_at)}</span></div><div class="t">${esc(e.title)} ${ext(e.url)}</div><div class="why">${esc(e.so_what||e.detail||"")}</div></div>`).join(""):'<div class="empty">No listed parent moved 5% or more in the last two days. The daily tier reads Titan, Garmin, Zepp Health, Alphabet, Samsung and Palred.</div>'}</div>
  </div>`;
  bindActs(v);v.querySelectorAll(".rb").forEach(g=>g.onclick=()=>location.hash="#/brand/"+encodeURIComponent(g.dataset.brand));}

/* ---------- News ---------- */
async function vNews(v){head("News","stories across publishers · topics · share of voice · trending in India now");const F=JSON.parse(sessionStorage.getItem("newsf")||"{}");F.days=F.days||14;
  const d=await api(`/api/news?days=${F.days}`);const topics=d.topic_list||[];const st=d.stats||{};
  const sov=d.share.filter(s=>s.mentions||s.prev).slice(0,12),vel=d.velocity||{weeks:[],brands:{}};
  const tc=d.trends_checked;const pulse=d.search_pulse||[];
  v.innerHTML=`<div class="kpis">${kpi("Stories",fmt(st.stories),`${F.days} days`)}${kpi("Articles",fmt(st.articles),"Google News + Bing + newsrooms")}${kpi("Multi-outlet",fmt(st.multi_source),"3+ publishers")}${kpi("Brands in the news",fmt(st.brands),"of "+STATS.brands.length+" tracked")}${kpi("Trending now",fmt((d.trending||[]).length),(d.trending||[]).length?"Google Trends India matches":tc?`none of ${tc.n} national trends · ${ago(tc.at)}`:"Google Trends India, every 30 min")}</div>
  <div class="grid gwide">
    <div class="card"><div class="row wrap" style="margin-bottom:10px"><input id="nq" placeholder="search headlines…" value="${esc(F.q||"")}" style="min-width:160px"><select id="nb"><option value="">All brands</option>${STATS.brands.map(b=>`<option ${F.brand===b.name?"selected":""}>${esc(b.name)}</option>`).join("")}<option ${F.brand==="Sector"?"selected":""}>Sector</option></select><select id="nt"><option value="">All topics</option>${topics.concat(["general"]).map(t=>`<option value="${t}" ${F.topic===t?"selected":""}>${kind(t)}</option>`).join("")}</select><select id="nd">${[3,7,14,30,60].map(x=>`<option value="${x}" ${F.days==x?"selected":""}>${x} days</option>`).join("")}</select><select id="ns"><option value="strength" ${F.sort!=="newest"?"selected":""}>strongest first</option><option value="newest" ${F.sort==="newest"?"selected":""}>newest first</option></select><span class="grow"></span><button class="sm ghost" id="nref" title="Fetch Google News, Bing News and the newsroom feeds now">↻ refresh news</button></div><div class="small muted" style="margin:-4px 0 10px">a story = one headline across every outlet that ran it${d.last_run&&d.last_run.at?` · ${lastRunLine(d.last_run)}`:""}</div><div id="stories">${d.stories.map(s=>storyCard(s)).join("")||'<div class="empty">No stories in this window.</div>'}</div></div>
    <div style="display:grid;gap:16px;align-content:start">
      <div class="card"><h2>Share of voice <span class="hint">news mentions, 30 days</span></h2>${bars(sov,{label:r=>r.brand,value:r=>r.mentions,fmtv:v=>fmt(v),color:r=>r.self?"var(--accent)":"var(--s1)",link:r=>"#/brand/"+encodeURIComponent(r.brand)})}<div class="small muted" style="margin-top:6px">${sov.slice(0,6).map(r=>`${esc(r.brand)} ${r.mentions>r.prev?'<span style="color:var(--up)">▲</span>':r.mentions<r.prev?'<span style="color:var(--s8)">▼</span>':"="} ${r.prev}→${r.mentions}`).join(" · ")}</div></div>
      <div class="card"><h2>Topics <span class="hint">30 days</span></h2>${bars(d.topics||[],{label:r=>kind(r.topic),value:r=>r.count,color:r=>TCOL[r.topic]||"var(--s1)"})}</div>
      <div class="card"><h2>Trending in India <span class="hint">Google Trends, matched to the sector</span></h2>${(d.trending||[]).length?d.trending.map(t=>`<div class="row small" style="padding:5px 0;border-bottom:1px solid var(--line)"><a href="${esc(t.url||"https://trends.google.com/trending?geo=IN")}" target="_blank" rel="noopener"><b>${esc(t.title)}</b></a><span class="muted">${esc(t.traffic||"")}</span><span class="grow"></span>${t.brand&&t.brand!=="Sector"?`<a class="chip" href="#/brand/${encodeURIComponent(t.brand)}">${esc(t.brand)}</a>`:t.segment?`<span class="chip">${esc(t.segment)}</span>`:""}<span class="muted">${ago(t.seen_at)}</span></div>`).join(""):`<div class="empty">${tc?`None of India's ${tc.n} national trends is from the category (checked ${ago(tc.at)}).`:"Google Trends India is read every 30 minutes; nothing from the sector has matched yet."}</div>${pulse.length?`<div class="small muted" style="margin:8px 0 4px">What India is starting to search for in the category (Google autocomplete, 7 days)</div>${pulse.map(p=>`<div class="row small" style="padding:4px 0;border-bottom:1px solid var(--line)"><a href="${esc(p.url)}" target="_blank" rel="noopener"><b>${esc(p.suggestion)}</b></a><span class="grow"></span>${p.brand&&p.brand!=="Sector"?`<a class="chip" href="#/brand/${encodeURIComponent(p.brand)}">${esc(p.brand)}</a>`:""}${pill(p.importance)}</div>`).join("")}`:""}`}</div>
      <div class="card"><h2>Velocity <span class="hint">news per week, 8 weeks</span></h2>${Object.entries(vel.brands).sort((a,b)=>b[1].reduce((x,y)=>x+y,0)-a[1].reduce((x,y)=>x+y,0)).slice(0,10).map(([b,s])=>`<div class="row" style="padding:3px 0"><a style="min-width:110px" href="#/brand/${encodeURIComponent(b)}">${esc(b)}</a>${spark(s,140,22,b===STATS.self?"var(--accent)":"var(--s1)")}<span class="num muted small" style="margin-left:auto">${s[s.length-1]} this week</span></div>`).join("")||'<div class="empty">Not enough history yet.</div>'}</div>
      <div class="card"><h2>Publishers <span class="hint">30 days</span></h2><table><tr><th>Outlet</th><th class="num">Stories</th><th class="num">Brands</th></tr>${(d.publishers||[]).slice(0,10).map(p=>`<tr><td>${esc(p.publisher)}</td><td class="num">${p.stories}</td><td class="num">${p.brands}</td></tr>`).join("")}</table></div>
    </div>
  </div>`;
  const reload=async()=>{const f={brand:$("#nb").value,topic:$("#nt").value,days:$("#nd").value,q:$("#nq").value.trim(),sort:$("#ns").value};sessionStorage.setItem("newsf",JSON.stringify(f));$("#stories").innerHTML='<div class="empty">Loading…</div>';try{const r=await api(`/api/news?${new URLSearchParams(f)}`,{});$("#stories").innerHTML=r.stories.map(s=>storyCard(s)).join("")||'<div class="empty">No stories match. Widen the window or clear the search.</div>';}catch(e){$("#stories").innerHTML=`<div class="card"><b>Could not load stories.</b><div class="muted small">${esc(e.message)}</div></div>`;}};
  ["#nb","#nt","#nd","#ns"].forEach(s=>$(s).onchange=reload);let qt;$("#nq").oninput=()=>{clearTimeout(qt);qt=setTimeout(reload,350);};$("#nref").onclick=()=>collectNow("news",$("#nref"));if(F.brand||F.topic||F.q||F.sort==="newest")reload();}

/* ---------- Financials ---------- */
function finRow(p){const r=p.revenue,q=p.quote,pr=p.profit;const own={listed:"listed",private:"private",subsidiary:"subsidiary","brand-licence":"licence"}[p.ownership]||p.ownership||"–";
  return`<tr data-fb="${esc(p.brand)}" style="cursor:pointer${p.self?";background:color-mix(in srgb,var(--accent) 8%,transparent)":""}"><td><b>${esc(p.brand)}</b>${p.self?' <span class="pill i0">you</span>':""}<div class="small muted">${esc(p.entity||"–")}</div></td><td><span class="chip">${esc(own)}</span>${p.ticker?`<div class="small muted">${esc(p.ticker)}</div>`:""}</td>
  <td class="num">${r?`${money(r.value,r.currency,r.unit)}<div class="small muted">${esc(r.period)}</div>`:'<span class="muted">–</span>'}</td><td class="num" style="color:${sgn(p.revenue_growth_pct)}">${p.revenue_growth_pct!=null?pct(p.revenue_growth_pct):"–"}</td>
  <td class="num" style="color:${pr?sgn(pr.signed):"inherit"}">${pr?`${money(pr.signed,pr.currency,pr.unit)}${pr.margin_pct!=null?`<div class="small muted">${pct(pr.margin_pct)} margin</div>`:""}`:"–"}</td>
  <td class="num">${p.valuation?`${money(p.valuation.value,p.valuation.currency,p.valuation.unit)}<div class="small muted">valuation ${esc(p.valuation.period)}</div>`:p.funding_total?`${money(p.funding_total.value,p.funding_total.currency,p.funding_total.unit)}<div class="small muted">raised</div>`:p.funding_round?`${money(p.funding_round.value,p.funding_round.currency,p.funding_round.unit)}<div class="small muted">last round ${esc(p.funding_round.period)}</div>`:"–"}</td>

   <div class="grid g2" style="margin-top:12px"><div><h3>Revenue</h3>${colChart((p.revenue_series||[]).map(s=>({label:s.period,value:s.value,conf:s.confidence})),{w:300,h:120,fmtv:v=>cur==="INR"?fmt(v):money(v,cur,unit)})}</div><div><h3>Net result</h3>${colChart((p.profit_series||[]).map(s=>({label:s.period,value:s.value,conf:s.confidence})),{w:300,h:120,fmtv:v=>cur==="INR"?fmt(v):money(v,cur,unit)})}</div></div>
   <a class="small" href="#/financials/${encodeURIComponent(d.brand)}">full financial profile →</a></div>
  <div style="display:grid;gap:16px;align-content:start">${q?`<div class="card"><h2>Share price <span class="hint">${esc(q.ticker)} · ${esc(q.currency)}</span></h2>${lineChart(q.closes,{l0:"6 months",l1:q.day})}<div class="row small" style="margin-top:4px"><b>${fmt(q.close)}</b><span style="color:${sgn(q.change_pct)}">${pct(q.change_pct)} 1d</span><span style="color:${sgn(q.change_30d_pct)}">${pct(q.change_30d_pct)} 30d</span><span class="muted">52w ${fmt(q.low52)}–${fmt(q.high52)}</span></div></div>`:""}
   <div class="card"><h2>Figures on file</h2><table><tr><th>Metric</th><th>Period</th><th class="num">Value</th><th>Source</th></tr>${rows.slice().reverse().slice(0,14).map(x=>`<tr><td>${esc(kind(x.metric))}</td><td>${esc(x.period)}</td><td class="num">${money(x.value,x.currency,x.unit)}</td><td class="small">${confChip(x.confidence)} ${x.url?`<a class="muted" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.source.slice(0,40))}</a>`:`<span class="muted">${esc(x.source.slice(0,40))}</span>`}</td></tr>`).join("")||'<tr><td colspan=4 class="muted">Nothing on file. Seed figures in config/companies.yaml; the daily financials sweep adds filings and press figures.</td></tr>'}</table></div>
   <div class="card"><h2>Money news</h2>${(p.money_events||[]).concat(p.news||[]).slice(0,8).map(e=>`<div class="small" style="padding:5px 0;border-bottom:1px solid var(--line)"><span class="muted">${ago(e.created_at)}</span> <a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a></div>`).join("")||'<div class="empty">None yet.</div>'}</div></div></div>`;}

render().then(connect);
</script>
<script src="/static/ux.js"></script>
</body>
</html>
