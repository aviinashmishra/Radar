<!doctype html>
<html lang="en" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pebble Radar</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%232a78d6%22/%3E%3Cg fill=%22none%22 stroke=%22%23fff%22 stroke-width=%222%22 stroke-linecap=%22round%22%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%227%22/%3E%3Ccircle cx=%2212%22 cy=%2212%22 r=%223%22/%3E%3Cpath d=%22M12 5v7l4.5 4.5%22/%3E%3C/g%3E%3C/svg%3E">
<style>
/* ---------- tokens ---------- */
:root{
  --bg:#f9f9f7; --surface:#fcfcfb; --surface-2:#f1f0ec; --line:#e1e0d9; --axis:#c3c2b7;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --accent:#2a78d6; --accent-ink:#fff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b; --up:#006300;
  --seq1:#1c5cab; --seq2:#2a78d6; --seq3:#5598e7; --seq4:#86b6ef; --seq5:#cde2fb;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -16px rgba(0,0,0,.25);
  --r:12px; --nav:220px;
}
:root[data-theme="dark"], :root[data-theme="auto"][data-dark="1"]{
  --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --line:#2c2c2a; --axis:#383835;
  --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
  --accent:#3987e5; --accent-ink:#fff;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --up:#0ca30c;
  --seq1:#184f95; --seq2:#256abf; --seq3:#3987e5; --seq4:#6da7ec; --seq5:#9ec5f4;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);
}
/* ---------- base ---------- */
*{box-sizing:border-box} html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none} a:hover{text-decoration:underline}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em} h1{font-size:22px} h2{font-size:15px} h3{font-size:13px;color:var(--ink-2)}
button,input,select{font:inherit;color:inherit}
button{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer;transition:border-color .15s,background .15s}
button:hover{border-color:var(--axis)} button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} button.ghost{border-color:transparent;background:transparent;color:var(--ink-2)} button.ghost:hover{background:var(--surface-2)}
button.sm{padding:3px 9px;font-size:12px;border-radius:6px}
input,select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px} input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--accent) 40%,transparent);border-color:var(--accent)}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)} .small{font-size:12px} .num{font-variant-numeric:tabular-nums} .right{text-align:right}
.row{display:flex;align-items:center;gap:8px} .wrap{flex-wrap:wrap} .grow{flex:1} .gap16{gap:16px}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--nav) 1fr;min-height:100%}
nav{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);background:var(--surface);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
nav .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 16px;font-weight:600;font-size:15px}
nav .brand .logo{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:#fff}
nav a.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2)} nav a.item:hover{background:var(--surface-2);text-decoration:none}
nav a.item.on{background:var(--surface-2);color:var(--ink);font-weight:500}
nav .bottom{margin-top:auto;padding:10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.live{display:inline-flex;align-items:center;gap:6px} .dot{width:7px;height:7px;border-radius:50%;background:var(--good)} .dot.off{background:var(--critical)}
.theme{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden} .theme button{border:0;border-radius:0;padding:5px 8px;background:transparent;color:var(--muted)} .theme button.on{background:var(--surface-2);color:var(--ink)}
main{min-width:0;padding:22px 28px 60px;max-width:1280px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.top .sub{color:var(--muted);font-size:13px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 12px;min-width:260px;color:var(--muted);cursor:text}
.search kbd{margin-left:auto;font:11px/1 ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:2px 5px;color:var(--muted)}
/* ---------- cards / grid ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0} .card:has(table){overflow-x:auto}
.card h2{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px} .card h2 .hint{font-weight:400;color:var(--muted);font-size:12px;margin-left:auto}
.grid{display:grid;gap:16px} .grid>*{min-width:0} .g2{grid-template-columns:1fr 1fr} .g3{grid-template-columns:2fr 1fr 1fr} .gauto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
@media(max-width:1500px){.g3{grid-template-columns:1fr 1fr}} @media(max-width:860px){.g2,.g3{grid-template-columns:1fr} .shell{grid-template-columns:56px 1fr} nav .brand span,nav a.item span,nav .bottom{display:none} nav a.item{justify-content:center;padding:10px} main{padding:16px}}
.empty{color:var(--muted);font-size:13px;padding:14px 0}
table{width:100%;border-collapse:collapse;font-size:13px} th{text-align:left;font-weight:500;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line)} td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top} tr:last-child td{border-bottom:0} td.num,th.num{text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:600;line-height:18px;white-space:nowrap}
.pill.i9{background:var(--critical);color:#fff} .pill.i7{background:var(--serious);color:#0b0b0b} .pill.i5{background:var(--warn);color:#0b0b0b} .pill.i0{background:var(--surface-2);color:var(--ink-2)}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--ink-2);background:var(--surface);margin:2px 2px 2px 0}
/* action cards */
.act{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:grid;gap:6px;transition:opacity .25s}
.act.gone{opacity:.35}
.act .meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)} .act .meta b{color:var(--ink);font-weight:600}
.act .t{font-weight:500;font-size:14px} .act .why{color:var(--ink-2);font-size:13px} .act .move{font-size:13px;color:var(--ink-2);padding-left:10px;border-left:2px solid var(--s3)}
.act .btns{display:flex;gap:6px;margin-top:4px}
/* feed */
.fr{display:grid;grid-template-columns:58px 28px 1fr auto;gap:10px;align-items:start;padding:9px 6px;border-bottom:1px solid var(--line);cursor:pointer} .fr:hover{background:var(--surface-2)} .fr .ago{color:var(--muted);font-size:12px;padding-top:2px}
.fr>div{min-width:0;overflow-wrap:anywhere} .fr .b{font-weight:500} .fr .k{color:var(--muted);font-size:12px} .fr .x{display:none;grid-column:1/-1;padding:4px 6px 8px 96px;color:var(--ink-2);font-size:13px} .fr.open .x{display:block}
.newpill{position:sticky;top:8px;z-index:3;display:none;margin:0 auto 8px;width:max-content;background:var(--accent);color:#fff;border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer;box-shadow:var(--shadow)}
/* brand card */
.bc{display:grid;gap:8px;cursor:pointer} .bc:hover{border-color:var(--axis);text-decoration:none} .bc .n{font-weight:600;font-size:15px} .bc .stats{display:flex;gap:14px;font-size:12px;color:var(--muted)} .bc .stats b{display:block;color:var(--ink);font-size:14px;font-weight:500}
/* heatmap */
.heat td.c{text-align:center;border:2px solid var(--surface);border-radius:4px;color:#fff;min-width:46px;cursor:default;font-size:12px} .heat td.gap{outline:2px dashed var(--s2);outline-offset:-3px} .heat td.e{background:var(--surface-2);color:var(--muted)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:8px;align-items:center} .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.bar{display:grid;grid-template-columns:120px 1fr 40px;gap:8px;align-items:center;margin:5px 0;font-size:13px} .bar .tr{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden} .bar .f{height:100%;background:var(--s1);border-radius:0 4px 4px 0} .bar .v{color:var(--ink-2);text-align:right}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap} .tabs button{white-space:nowrap;border:0;border-radius:0;background:transparent;color:var(--muted);padding:8px 12px;border-bottom:2px solid transparent;margin-bottom:-1px} .tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.answer{white-space:pre-wrap;font-size:13px;line-height:1.55}
.shot{display:grid;gap:4px;text-align:center;font-size:12px;color:var(--muted)} .shot img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--line)}
/* tooltip, palette, toast */
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--ink);z-index:50;display:none;max-width:300px;box-shadow:var(--shadow);white-space:pre-wrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;padding:12vh 16px;z-index:40} .ov.on{display:flex}
.pal{width:100%;max-width:640px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.pal input{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 16px;font-size:15px;background:transparent} .pal input:focus{outline:0}
.pal .res{max-height:50vh;overflow:auto} .pal .r{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;font-size:13px} .pal .r:hover,.pal .r.sel{background:var(--surface-2)} .pal .r .k{margin-left:auto;color:var(--muted);font-size:11px}
.pal .ans{padding:14px 16px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:13px;z-index:60;display:none}
svg text{fill:var(--muted);font-size:10px}
@media(max-width:600px){.fr{grid-template-columns:auto auto 1fr} .fr>span.k{display:none} .fr .x{padding-left:6px} .search{min-width:0;flex:1} main{padding:12px} .card{padding:14px}}
</style>
</head>

<div class="shell">
  <nav id="nav">
    <div class="brand"><div class="logo"><svg class="i" style="width:15px;height:15px;stroke:#fff"><use href="#i-radar"/></svg></div><span>Pebble Radar</span></div>

<script>
/* ---------- utilities ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n==null?"–":Number(n).toLocaleString("en-IN",{maximumFractionDigits:0});
const inr=n=>n==null?"–":"₹"+fmt(n);
const ago=iso=>{if(!iso)return"";const d=(Date.now()-new Date(iso.match(/[Z+]/)?iso:iso+"Z"))/1000;if(d<60)return"just now";if(d<3600)return Math.floor(d/60)+"m ago";if(d<86400)return Math.floor(d/3600)+"h ago";return Math.floor(d/86400)+"d ago";};
const impc=i=>i>=9?"i9":i>=7?"i7":i>=5?"i5":"i0";
const pill=i=>`<span class="pill ${impc(i)}">${i??"–"}</span>`;
const kind=k=>String(k||"").replace(/_/g," ");
/* a GET that lands after the user has navigated on is dropped, so a slow view never paints over the current one */
let NAV=0;class Stale extends Error{}addEventListener("unhandledrejection",e=>{if(e.reason instanceof Stale)e.preventDefault();});
const api=async(p,o)=>{const n=NAV;const r=await fetch(p,o);if(!r.ok)throw new Error(p+" "+r.status);const j=await r.json();if(!o&&n!==NAV)throw new Stale();return j;};
const post=(p,b)=>api(p,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b||{})});
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",Math.max(2200,m.length*45));};
const ext=u=>u?`<a href="${esc(u)}" target="_blank" rel="noopener" class="muted" title="open"><svg class="i" style="width:13px;height:13px;vertical-align:-2px"><use href="#i-ext"/></svg></a>`:"";
let STATS=null;

/* ---------- theme ---------- */
const mq=matchMedia("(prefers-color-scheme: dark)");
function applyTheme(t){document.documentElement.dataset.theme=t;document.documentElement.dataset.dark=mq.matches?"1":"0";$$("#theme button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));try{localStorage.setItem("theme",t)}catch(e){}}
mq.addEventListener("change",()=>applyTheme(document.documentElement.dataset.theme));
$$("#theme button").forEach(b=>b.onclick=()=>applyTheme(b.dataset.t));
let savedTheme="auto";try{savedTheme=localStorage.getItem("theme")||"auto"}catch(e){} applyTheme(savedTheme);

/* ---------- charts ---------- */
function spark(series,w=120,h=28,color="var(--s1)"){const mx=Math.max(1,...series),n=series.length;const pts=series.map((v,i)=>`${(i/(n-1))*(w-4)+2},${h-2-(v/mx)*(h-6)}`).join(" ");return`<svg width="${w}" height="${h}" aria-label="activity, 14 days"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/><circle cx="${w-2}" cy="${h-2-(series[n-1]/mx)*(h-6)}" r="3" fill="${color}" stroke="var(--surface)" stroke-width="1.5"/></svg>`;}
function priceLine(hist){if(hist.length<2)return'<span class="muted small">only one snapshot so far</span>';const W=460,H=110,P=10;const ps=hist.map(h=>h.price),mn=Math.min(...ps),mx=Math.max(...ps);const y=v=>H-P-((v-mn)/(mx-mn||1))*(H-2*P-10),x=i=>P+i*(W-2*P)/(hist.length-1);return`<svg width="${W}" height="${H}" role="img" aria-label="price history"><line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="var(--line)"/><polyline points="${hist.map((h,i)=>`${x(i)},${y(h.price)}`).join(" ")}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>${hist.map((h,i)=>`<circle cx="${x(i)}" cy="${y(h.price)}" r="4" fill="${h.available?"var(--s1)":"var(--s8)"}" stroke="var(--surface)" stroke-width="2"><title>${h.seen_at.slice(0,16).replace("T"," ")} ${inr(h.price)}${h.available?"":" · out of stock"}</title></circle>`).join("")}<text x="${P}" y="${H-1}">${inr(mn)}</text><text x="${W-70}" y="${H-1}">${inr(mx)}</text></svg>`;}
function ring(rows){const W=420,H=284,cx=W/2,cy=H/2,R=112,r0=28,dOf=s=>r0+(1-Math.min(100,Math.max(0,s))/100)*(R-12-r0);
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:480px;display:block;margin:0 auto" role="img" aria-label="threat radar">`;[R,dOf(50),dOf(80)].forEach(r=>g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)"/>`);
  /* angle fixed per brand (alphabetical), distance from P = quietness; overlapping dots are nudged apart sideways */
  const n=rows.length||1,P=[...rows].sort((a,b)=>a.brand.localeCompare(b.brand,undefined,{sensitivity:"base"})).map((r,k)=>({r,a:-Math.PI/2+(k+.5)*2*Math.PI/n,d:dOf(r.score),s:5+Math.min(r.events_7d,30)/7.5}));
  for(let it=0,hit=1;it<150&&hit;it++){hit=0;for(let i=0;i<P.length;i++)for(let j=i+1;j<P.length;j++){const p=P[i],q=P[j],over=p.s+q.s+3-Math.hypot(Math.cos(q.a)*q.d-Math.cos(p.a)*p.d,Math.sin(q.a)*q.d-Math.sin(p.a)*p.d);if(over>0){hit=1;const dir=Math.sin(q.a-p.a)>=0?1:-1;p.a-=dir*(over/2+.5)/p.d;q.a+=dir*(over/2+.5)/q.d;}}}
  /* names sit outside the ring in two columns, stacked so they never collide, joined to their dot by a leader line */
  const lab=P.map(p=>({p,side:Math.cos(p.a)>=0?1:-1,y:cy+Math.sin(p.a)*(R+6)}));
  [1,-1].forEach(sd=>{const s=lab.filter(l=>l.side===sd).sort((a,b)=>a.y-b.y);s.forEach((l,i)=>l.y=Math.max(l.y,i?s[i-1].y+17:10));for(let i=s.length-1;i>=0;i--)s[i].y=Math.min(s[i].y,i<s.length-1?s[i+1].y-17:H-8);});
  lab.forEach(l=>l.x=cx+l.side*(Math.sqrt(Math.max(0,(R+14)**2-(l.y-cy)**2))+8));
  const pt=(a,r)=>`${(cx+Math.cos(a)*r).toFixed(1)},${(cy+Math.sin(a)*r).toFixed(1)}`;
  g+=`<g fill="none" stroke="var(--axis)" stroke-width="1">${lab.map(({p,x,y,side})=>`<polyline points="${pt(p.a,p.d+p.s+2)} ${pt(p.a,R+6)} ${(x-side*3).toFixed(1)},${y.toFixed(1)}"/>`).join("")}</g>`;
  g+=`<circle cx="${cx}" cy="${cy}" r="12" fill="var(--accent)"/><text x="${cx}" y="${cy+4}" text-anchor="middle" style="fill:#fff;font-weight:600">P</text>`;
  lab.forEach(({p,x,y,side})=>{const r=p.r,col=r.score>=80?"var(--s2)":r.score>=50?"var(--s4)":"var(--s1)",nm=r.brand.length>14?r.brand.slice(0,13)+"…":r.brand;
    g+=`<g class="rb" data-brand="${esc(r.brand)}" data-tip="${esc(r.brand)} · score ${r.score}\n${r.events_7d} events, ${r.signals_7d} signals, launch ${r.launch}\n${esc(r.why.join("\n"))}" style="cursor:pointer"><circle cx="${(cx+Math.cos(p.a)*p.d).toFixed(1)}" cy="${(cy+Math.sin(p.a)*p.d).toFixed(1)}" r="${p.s.toFixed(1)}" fill="${col}" stroke="var(--surface)" stroke-width="2"/><text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="${side>0?"start":"end"}" style="fill:var(--ink-2);font-size:12px${r.score>=50?";font-weight:600":""}">${esc(nm)}</text></g>`;});
  g+="</svg>";
  g+=`<div style="margin-top:10px">${rows.slice(0,5).map((r,i)=>`<a class="row small" style="padding:4px 0;border-bottom:1px solid var(--line)" href="#/brand/${encodeURIComponent(r.brand)}"><span class="muted num" style="width:14px">${i+1}</span><b>${esc(r.brand)}</b><span class="grow muted">${r.events_7d} events · launch ${r.launch}${r.signals_7d?` · ${r.signals_7d} signals`:""}</span><span class="num ink2">${r.score}</span></a>`).join("")}</div>`;
  return g;}
/* ---------- live updates: a stream on the local server, a one-minute poll in cloud mode ---------- */
let unseen=[],SEEN=new Set(),es,PA=0,PS=0;
function onEvent(e){if(SEEN.has(e.id))return;SEEN.add(e.id);unseen.push(e);const p=$("#newpill");if(p){p.style.display="block";p.textContent=`${unseen.length} new · click to show`;}else if(route()==="today"){scheduleRefresh();}}
function onSignal(){if(route()==="today")scheduleRefresh();}
/* cloud mode: the indicator shows how old the snapshot is (GitHub Actions publishes one every ~15 min) */
function liveState(){const h=STATS&&STATS.hosted;if(!h)return;const at=h.published_at,hrs=at?(Date.now()-new Date(at))/36e5:99;
  $("#dot").classList.toggle("off",!at||hrs>2||!!h.error);$("#livetxt").textContent=at?`cloud · updated ${ago(at)}`:"cloud · waiting for data";
  $("#livetxt").title=h.error||"Data from the GitHub Actions worker"+(h.tier?` (last run: ${h.tier} tier)`:"");}
async function poll(){try{const u=await api(`/api/updates?after_id=${PA}&after_sig=${PS}`);if(PA){u.events.forEach(onEvent);if(u.signals.length)onSignal();}PA=u.after_id;PS=u.after_sig;}catch(e){}}
function connect(){if(STATS&&STATS.hosted){liveState();poll();setInterval(poll,60000);return;}
  es=new EventSource("/api/stream");es.onopen=()=>{$("#dot").classList.remove("off");$("#livetxt").textContent="live";};es.onerror=()=>{$("#dot").classList.add("off");$("#livetxt").textContent="reconnecting";};
  es.addEventListener("event",m=>onEvent(JSON.parse(m.data)));
  es.addEventListener("signal",onSignal);}
let rt;function scheduleRefresh(){clearTimeout(rt);rt=setTimeout(()=>render(),2500);}
/* cloud mode serves a read-only snapshot, so Done / Later is remembered in this browser (two weeks) */
const TRI={all(){try{return JSON.parse(localStorage.getItem("triage")||"{}")}catch(e){return{}}},
  add(k){const t=this.all(),now=Date.now();for(const x in t)if(now-t[x]>14*864e5)delete t[x];t[k]=now;try{localStorage.setItem("triage",JSON.stringify(t))}catch(e){}}};
const isOpen=(kind,id)=>!(STATS&&STATS.hosted&&TRI.all()[kind+id]);

  try{STATS=STATS||await api("/api/stats");const lr=STATS.last_runs.fast||STATS.last_runs.all;$("#sweep").textContent=lr?`stores swept ${ago(lr.at)}`:"no sweep yet";
    await ({today:vToday,feed:vFeed,brands:vBrands,brand:vBrand,segments:vSegments,segment:vSegments,pricing:vPricing,market:vMarket,briefs:vBriefs,settings:vSettings}[r]||vToday)(v);}

function actCard(e,isSignal){const id=e.id;return`<div class="act" data-id="${id}" data-kind="${isSignal?"signal":"event"}">
  <div class="meta">${pill(e.importance)}<b>${esc(e.brand)}</b><span>${esc(kind(e.kind))}</span><span style="margin-left:auto">${ago(e.created_at)}</span></div>
  <div class="t">${esc(e.title)} ${ext(e.url)}</div>
  ${e.so_what&&!e.so_what.includes(e.title.slice(0,40))?`<div class="why">${esc(e.so_what)}</div>`:isSignal&&e.detail?`<div class="why">${esc(e.detail.slice(0,300))}</div>`:""}
  ${e.counter_move&&e.counter_move!=="No action"?`<div class="move">${esc(e.counter_move)}</div>`:""}
  <div class="btns"><button class="sm" data-st="done"><span class="row"><svg class="i" style="width:13px;height:13px"><use href="#i-check"/></svg> Done</span></button><button class="sm ghost" data-st="snoozed"><span class="row"><svg class="i" style="width:13px;height:13px"><use href="#i-clock"/></svg> Later</span></button>${e.brand&&!isSignal?`<a class="muted small" style="margin-left:auto;align-self:center" href="#/brand/${encodeURIComponent(e.brand)}">brand page →</a>`:""}</div></div>`;}

    $("#pl").querySelectorAll("[data-pid]").forEach(b=>b.onclick=async()=>{const h=await api(`/api/price_history?brand=${encodeURIComponent(name)}&product_id=${b.dataset.pid}`);const tr=document.createElement("tr");tr.innerHTML=`<td colspan=5>${priceLine(h)}</td>`;b.closest("tr").after(tr);b.disabled=true;});};

/* ---------- segments: price ladder per form factor ---------- */
function ladderSvg(rows){const pts=rows.filter(r=>r.price);if(!pts.length)return'<div class="empty">No priced products yet.</div>';
  const W=900,L=30,R=30,STEP=13,RAD=5;const mn=Math.min(...pts.map(r=>r.price)),mx=Math.max(...pts.map(r=>r.price));const lx=v=>Math.log10(v),x=v=>L+(lx(v)-lx(mn))/((lx(mx)-lx(mn))||1)*(W-L-R);
  const ticks=[500,1000,2000,3000,5000,10000,20000,30000,40000].filter(t=>t>=mn&&t<=mx);
  // stack dots that collide; chart height follows the tallest stack so dots never run into the label band
  const placed=[];pts.forEach(r=>{const px=x(r.price);let lane=0;while(placed.some(p=>p.lane===lane&&Math.abs(p.x-px)<STEP))lane++;placed.push({r,x:px,lane});});
  const lanes=Math.max(...placed.map(p=>p.lane))+1;
  // Pebble labels: greedy, non-overlapping, in up to 3 rows above the stacks. Anything that does not fit goes to the strip below.
  const clean=n=>n.replace(/^Pebble /,"").replace(/™|®/g,"").replace(/\s*[|(-].*$/,"").trim();
  const mine=pts.filter(r=>r.self).sort((a,b)=>a.price-b.price);const labels=[],rowsUsed=[[],[],[]],seen=new Set();
  mine.forEach(r=>{const name=clean(r.name).slice(0,16);const k=name.toLowerCase()+"|"+Math.round(r.price/100);if(!name||seen.has(k))return;
    const px=x(r.price),w=name.length*6.2+10,x0=Math.max(L,Math.min(W-R-w,px-w/2)),x1=x0+w;
    const row=rowsUsed.findIndex(rw=>rw.every(([a,b])=>x1<a-4||x0>b+4));if(row<0)return;
    rowsUsed[row].push([x0,x1]);seen.add(k);labels.push({name,px,cx:x0+w/2,row});});
  const nRows=labels.length?Math.max(...labels.map(l=>l.row))+1:0;const top=10+nRows*14;const axisY=top+lanes*STEP+18;const H=axisY+28;
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="price ladder" style="display:block"><line x1="${L}" x2="${W-R}" y1="${axisY}" y2="${axisY}" stroke="var(--axis)"/>`;
  ticks.forEach(t=>g+=`<line x1="${x(t)}" x2="${x(t)}" y1="${axisY-4}" y2="${axisY+4}" stroke="var(--axis)"/><text x="${x(t)}" y="${axisY+18}" text-anchor="middle">₹${fmt(t)}</text>`);
  placed.forEach(({r,x:px,lane})=>{const cy=axisY-10-lane*STEP;const fill=r.self?"var(--accent)":r.source==="watchlist"?"var(--s2)":"var(--s1)";const hollow=/sold|upcoming|limited|pre/i.test(r.status||"");
    g+=`<g data-tip="${esc(r.brand)} · ${esc(r.name)}\n₹${fmt(r.price)}${r.subscription&&r.subscription!=="None"?" · "+esc(r.subscription)+" subscription":""}${r.status?" · "+esc(r.status):""}${r.evidence?"\nevidence: "+esc(r.evidence):""}"><circle cx="${px}" cy="${cy}" r="${r.self?RAD+1:RAD}" fill="${hollow?"var(--surface)":fill}" stroke="${fill}" stroke-width="2"/></g>`;});
  const stackTop=px=>{const l=placed.filter(p=>Math.abs(p.x-px)<STEP).reduce((m,p)=>Math.max(m,p.lane),0);return axisY-10-l*STEP-RAD-2;};
  labels.forEach(l=>{const ly=top-4-(nRows-1-l.row)*14;g+=`<line x1="${l.px}" x2="${l.px}" y1="${ly+3}" y2="${stackTop(l.px)}" stroke="var(--accent)" stroke-opacity=".35"/><text x="${l.cx}" y="${ly}" text-anchor="middle" style="fill:var(--accent);font-weight:600">${esc(l.name)}</text>`;});
  g+="</svg>";
  // Pebble strip: every own SKU in price order, so nothing is lost when the chart cannot label it
  const strip=mine.map(r=>`<span class="chip" style="border-color:var(--accent);color:var(--accent)" title="${esc(r.name)}">${esc(clean(r.name).slice(0,22))} ₹${fmt(r.price)}</span>`).join("");
  return g+(strip?`<div class="hint" style="margin-top:8px">Pebble on this ladder</div><div>${strip}</div>`:"");}

   <div class="card"><h2>Integrations</h2><table><tr><td>AI layer</td><td>${s.ai?`<span class="pill i0">${s.provider==="gemini"?"Gemini":"Claude"} · ${esc(s.model)}</span>`:`<span class="muted">heuristic · set GEMINI_API_KEY or ANTHROPIC_API_KEY ${H?"in GitHub secrets (scoring) and the Vercel project (chat)":"in .env"}</span>`}</td></tr><tr><td>Telegram</td><td>${s.telegram?'<span class="pill i0">connected</span>':'<span class="muted">set TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID</span>'}</td></tr><tr><td>Alert threshold</td><td>${s.threshold}/10</td></tr><tr><td>Database</td><td class="small muted">${s.products} SKUs · ${s.events_total} events</td></tr><tr><td>Config</td><td class="small muted">${H?"config/competitors.yaml on GitHub · the next sweep uses it":"config/competitors.yaml · restart after editing"}</td></tr></table></div>
   <div class="card"><h2>Recent collector runs</h2><table><tr><th>Collector</th><th>Brand</th><th>Finished</th><th class="num">Events</th><th>Note</th></tr>${s.runs.slice(0,15).map(r=>`<tr><td>${esc(r.collector)}</td><td>${esc(r.brand)}</td><td class="small muted">${esc(r.finished_at.slice(11,16))}</td><td class="num">${r.events}</td><td class="small" style="color:${r.ok?"var(--muted)":"var(--s8)"}">${r.ok?"ok":esc(r.note)}</td></tr>`).join("")}</table></div>
   <div class="card"><h2>Export CSV</h2><div class="row wrap">${["events","products","price_history","signals","matches","reviews","videos","search_suggestions","app_metrics"].map(t=>`<a class="chip" href="/api/export/${t}.csv">${t}</a>`).join("")}</div><h2 style="margin-top:16px">Theme</h2><div class="row"><button data-th="light">Light</button><button data-th="dark">Dark</button><button data-th="auto">Follow system</button></div></div></div>`;
  v.querySelectorAll("[data-run]").forEach(b=>b.onclick=async()=>{const r=await post("/api/run?tier="+b.dataset.run);toast(r.message||(r.busy?"A sweep is already running; this one was not started":`${b.dataset.run} sweep started`));});v.querySelectorAll("[data-th]").forEach(b=>b.onclick=()=>applyTheme(b.dataset.th));
  const tg=$("#tgc");if(tg)tg.onclick=async()=>{try{const r=await post("/api/telegram/connect");toast(r.telegram&&r.telegram.ok?"Bot connected: send it /help on Telegram":"Telegram said: "+String(r.telegram&&r.telegram.description||"no answer"));}catch(e){toast("Could not connect: "+e.message);}};}

/* ---------- command palette ---------- */
const ov=$("#ov"),palq=$("#palq"),palres=$("#palres"),palans=$("#palans");let sel=0;
function openPal(){ov.classList.add("on");palq.value="";palans.style.display="none";palRender();setTimeout(()=>palq.focus(),0);}
function closePal(){ov.classList.remove("on");}
function palItems(q){const Q=q.toLowerCase().trim();const pages=[["Today","#/today"],["Feed","#/feed"],["Brands","#/brands"],["Segments","#/segments"],["Pricing","#/pricing"],["Market","#/market"],["Briefs","#/briefs"],["Settings","#/settings"]];const it=[];
  (STATS?STATS.brands:[]).filter(b=>!Q||b.name.toLowerCase().includes(Q)).slice(0,6).forEach(b=>it.push({l:b.name,k:"brand",go:()=>{location.hash="#/brand/"+encodeURIComponent(b.name);closePal();}}));
  pages.filter(p=>!Q||p[0].toLowerCase().includes(Q)).forEach(p=>it.push({l:p[0],k:"page",go:()=>{location.hash=p[1];closePal();}}));
  /* one word that names a brand or page jumps there on Enter; anything question-like asks the radar first */
  if(Q){const first=/\s/.test(Q)||!it.length;const a={l:`Ask the radar: “${q}”`,k:first?"Enter":"ask",go:()=>ask(q)};first?it.unshift(a):it.push(a);}
  if(Q)it.push({l:`Search feed for “${q}”`,k:"feed",go:()=>{sessionStorage.setItem("feedf",JSON.stringify({q}));location.hash="#/feed";if(route()==="feed")render();closePal();}});
  return it;}
let items=[];function palRender(){items=palItems(palq.value);sel=Math.min(sel,items.length-1);palres.innerHTML=items.map((i,n)=>`<div class="r ${n===sel?"sel":""}" data-n="${n}">${esc(i.l)}<span class="k">${esc(i.k)}</span></div>`).join("");palres.querySelectorAll(".r").forEach(r=>r.onclick=()=>items[+r.dataset.n].go());}
async function ask(q){palans.style.display="block";palans.textContent="Thinking…";try{const r=await post("/api/chat",{question:q});palans.textContent=r.answer+(r.mode==="keyword"?"\n\n(keyword mode: add GEMINI_API_KEY or ANTHROPIC_API_KEY for full answers)":r.mode==="locked"?"\n\n"+r.note:"");}catch(e){palans.textContent="Failed: "+e.message;}}
palq.oninput=()=>{sel=0;palRender();};palq.onkeydown=e=>{if(e.key==="ArrowDown"){sel=Math.min(sel+1,items.length-1);palRender();e.preventDefault();}else if(e.key==="ArrowUp"){sel=Math.max(sel-1,0);palRender();e.preventDefault();}else if(e.key==="Enter"){items[sel]?.go();}else if(e.key==="Escape")closePal();};
ov.onclick=e=>{if(e.target===ov)closePal();};$("#searchbtn").onclick=openPal;
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();openPal();}else if(e.key==="/"&&!/input|textarea|select/i.test(e.target.tagName)){e.preventDefault();openPal();}else if(e.key==="Escape")closePal();});

/* ---------- feed rows expand on click (one delegated listener) ---------- */
document.addEventListener("click",e=>{const r=e.target.closest(".fr");if(r&&!e.target.closest("a,button"))r.classList.toggle("open");});
/* ---------- tooltips, run button ---------- */
document.addEventListener("mousemove",e=>{const t=e.target.closest("[data-tip]"),tip=$("#tip");if(!t){tip.style.display="none";return;}tip.textContent=t.dataset.tip;tip.style.display="block";tip.style.left=Math.min(e.clientX+14,innerWidth-320)+"px";tip.style.top=(e.clientY+14)+"px";});
$("#runbtn").onclick=async()=>{const r=await post("/api/run?tier=fast");toast(r.message||(r.busy?"A sweep is already running; this one was not started":"Store sweep started · results land in a couple of minutes"));};
setInterval(async()=>{try{STATS=await api("/api/stats");const lr=STATS.last_runs.fast||STATS.last_runs.all;$("#sweep").textContent=lr?`stores swept ${ago(lr.at)}`:"";liveState();}catch(e){}},60000);
render().then(connect);
</script>
</body>
</html>
