<style>
/* Page-specific rules only; tokens and shared glass components live in /static/theme.css. */
:root{--nav:224px}
.shell{display:grid;grid-template-columns:var(--nav) 1fr;min-height:100%}
nav{position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin;padding:14px 12px 12px;display:flex;flex-direction:column;gap:2px;
  background:var(--glass);border-right:1px solid var(--glass-line);border-radius:0 30px 30px 0;box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.5);backdrop-filter:blur(var(--glass-blur)) saturate(1.5)}
nav .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;font-weight:700;font-size:15px;letter-spacing:-.02em;color:var(--ink)} nav .brand:hover{text-decoration:none}
nav .brand .logo{width:30px;height:30px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;flex:none;box-shadow:0 8px 18px -10px var(--accent)}
nav .grp{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 12px 5px;user-select:none;font-weight:600}
nav a.item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:999px;color:var(--ink-2);font-size:13.5px;font-weight:500;transition:background .15s var(--ease),color .15s,transform .15s var(--ease)}
nav a.item:hover{background:var(--glass-2);text-decoration:none;color:var(--ink);transform:translateX(2px)}
nav a.item.on{background:var(--glass-strong);color:var(--accent);font-weight:600;box-shadow:var(--shadow-sm)}
nav .bottom{margin-top:auto;padding:14px 12px 2px;font-size:12px;color:var(--muted);display:grid;gap:3px}
.live{display:inline-flex;align-items:center;gap:7px} .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 18%,transparent);animation:pulse 2.4s ease-in-out infinite} .dot.off{background:var(--critical);box-shadow:0 0 0 3px color-mix(in srgb,var(--critical) 18%,transparent);animation:none}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 18%,transparent)}50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--good) 8%,transparent)}}
main{min-width:0;padding:22px 30px 70px;max-width:1340px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap} .top h1{font-size:26px;font-weight:700;letter-spacing:-.03em} .top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.search{display:flex;align-items:center;gap:8px;border-radius:999px;padding:8px 14px;min-width:260px;color:var(--muted);cursor:text;font-size:13px;transition:box-shadow .2s var(--ease),transform .2s var(--ease)} .search:hover{box-shadow:var(--shadow-lift);transform:translateY(-1px)} .search kbd{margin-left:auto}
.theme{display:inline-flex;border-radius:999px;padding:3px;gap:2px} .theme button{border:0;border-radius:999px;padding:6px 9px;background:transparent;color:var(--muted);box-shadow:none} .theme button:hover{transform:none;background:var(--glass-2)} .theme button.on{background:var(--glass-strong);color:var(--ink);box-shadow:var(--shadow-sm)}
/* brand cards, screenshots, segments, misc */
.bc{display:grid;gap:8px;cursor:pointer;overflow:hidden} .bc>.row{flex-wrap:wrap;row-gap:4px} .bc .n{min-width:0;overflow-wrap:anywhere} .bc:hover{transform:translateY(-2px);text-decoration:none} .bc .n{font-weight:700;font-size:15px;letter-spacing:-.01em} .bc .stats{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap} .bc .stats b{display:block;color:var(--ink);font-size:14px;font-weight:600}
.shot{display:grid;gap:4px;text-align:center;font-size:12px;color:var(--muted)} .shot img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top;border-radius:16px;border:1px solid var(--glass-line);box-shadow:var(--shadow-sm)}
.seg{border-radius:18px;padding:14px 16px;display:grid;gap:4px} .seg .big,.big{font-size:21px;font-weight:700;letter-spacing:-.02em}
.xmat td.c{text-align:center;font-size:15px;min-width:44px;border-radius:10px} .xmat td.c sub{font-size:10px;margin-left:1px} .xmat th{white-space:nowrap}
.xq{font-size:13px;padding:7px 12px;margin:5px 0;border-left:3px solid var(--axis);background:var(--glass-2);border-radius:4px 14px 14px 4px} .xq.neg{border-left-color:var(--s8)} .xq.pos{border-left-color:var(--good)}
.xcl{padding:8px 0;border-bottom:1px solid var(--line)} .xcl:last-child{border-bottom:0}
.xrep h1{font-size:18px;margin:0 0 6px} .xrep h2{margin:18px 0 8px;font-size:15px} .xrep table{margin:6px 0 10px;font-size:12.5px} .xrep ul{padding-left:20px;margin:4px 0} .xrep hr{border:0;border-top:1px solid var(--line);margin:14px 0} .xrep{line-height:1.6}
/* the UX layer (static/ux.js): sorting, folding, collapsing, loading, motion */
.tabs{top:calc(var(--barh,0px) + 8px)}
th.ux-sort{cursor:pointer;user-select:none;transition:color .12s} th.ux-sort:hover{color:var(--ink)} th.ux-asc::after{content:" ↑";color:var(--accent)} th.ux-desc::after{content:" ↓";color:var(--accent)}
tr[data-fb]:hover td,tr[data-vb]:hover td,tr[data-go]:hover td,tr[style*="cursor:pointer"]:hover td,tr[style*="cursor: pointer"]:hover td{background:var(--accent-soft)}
.card>h2 .ux-cv{margin-left:6px;opacity:0;transition:opacity .15s,transform .15s;cursor:pointer;color:var(--muted);font-size:12px;line-height:1} .card:hover>h2 .ux-cv{opacity:1} .card.ux-collapsed>h2 .ux-cv{transform:rotate(-90deg);opacity:1}
.card.ux-collapsed>*:not(h2){display:none!important} .card.ux-collapsed>h2{margin-bottom:0}
.ux-hide{display:none!important} .ux-more{display:block;width:100%;margin-top:10px;text-align:center;color:var(--ink-2);background:var(--glass-2);border-color:transparent;border-radius:999px} .ux-more:hover{background:var(--glass-strong)}
.ux-count{display:inline-block;margin-left:6px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);font-size:10.5px;padding:0 7px;font-weight:600;vertical-align:1px;cursor:pointer} .ux-count.on{background:var(--accent);color:var(--accent-ink)}
#view.ux-in{animation:uxfade .3s var(--ease)} @keyframes uxfade{from{opacity:0;transform:translateY(8px) scale(.995)}to{opacity:1;transform:none}}
.ux-top{position:fixed;right:22px;bottom:22px;z-index:30;width:42px;height:42px;border-radius:50%;display:none;place-items:center;font-size:16px;padding:0} .ux-top.on{display:grid}
.ux-helpbtn{width:32px;height:32px;padding:0;border-radius:50%;color:var(--muted);font-weight:600} .ux-helpcard{width:100%;max-width:560px}
.ux-back{color:var(--accent)}
.ux-clamp{max-height:480px;overflow:hidden;position:relative;-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 90px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 90px),transparent)}
@media(prefers-reduced-motion:reduce){#view.ux-in{animation:none} .dot{animation:none}}
/* responsive shell */
@media(max-width:1000px){.shell{grid-template-columns:64px 1fr} nav{padding:10px 8px;border-radius:0 22px 22px 0} nav .brand{padding:4px 0 10px;justify-content:center} nav .brand .name,nav a.item span,nav .bottom{display:none} nav .grp{height:1px;padding:0;margin:6px 10px;background:var(--line);overflow:hidden;font-size:0} nav a.item{justify-content:center;padding:10px;border-radius:14px} nav a.item:hover{transform:none} main{padding:16px}}
@media(max-width:700px){.top{display:grid;grid-template-columns:1fr auto auto;gap:8px} .top>.grow{grid-column:1/-1} .search{min-width:0;grid-column:1/2} .theme{display:none} main{padding:12px} .card{padding:14px 16px} .top h1{font-size:21px} .shell{grid-template-columns:56px 1fr}}
@media print{nav,.top .search,#runbtn,.ux-top,.ux-helpbtn,.btns,.ux-more,.theme,.tabs{display:none!important} .shell{grid-template-columns:1fr} main{max-width:none;padding:0} .card{break-inside:avoid;border-color:#ccc;box-shadow:none;backdrop-filter:none} .tabpanel[hidden]{display:block} body::before,body::after{display:none}}
</style>
</head>

<script>
/* ---------- utilities ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>n==null?"–":Number(n).toLocaleString("en-IN",{maximumFractionDigits:0});
const inr=n=>n==null?"–":"₹"+fmt(n);
const ago=iso=>{if(!iso)return"";const d=(Date.now()-new Date(iso.match(/[Z+]/)?iso:iso+"Z"))/1000;if(d<60)return"just now";if(d<3600)return Math.floor(d/60)+"m ago";if(d<86400)return Math.floor(d/3600)+"h ago";return Math.floor(d/86400)+"d ago";};
const impc=i=>i>=9?"i9":i>=7?"i7":i>=5?"i5":"i0";
const pill=i=>`<span class="pill ${impc(i)}">${i??"–"}</span>`;
const kind=k=>String(k||"").replace(/_/g," ");
/* a GET that lands after the user has navigated on is dropped, so a slow view never paints over the current one */
let NAV=0;class Stale extends Error{}addEventListener("unhandledrejection",e=>{if(e.reason instanceof Stale)e.preventDefault();});
const api=async(p,o)=>{const n=NAV;const r=await fetch(p,o);if(!r.ok)throw new Error(p+" "+r.status);const j=await r.json();if(!o&&n!==NAV)throw new Stale();return j;};
const post=(p,b)=>api(p,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b||{})});
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",Math.max(2200,m.length*45));};
const ext=u=>u?`<a href="${esc(u)}" target="_blank" rel="noopener" class="muted" title="open"><svg class="i" style="width:13px;height:13px;vertical-align:-2px"><use href="#i-ext"/></svg></a>`:"";
let STATS=null;

/* ---------- theme ---------- */
const mq=matchMedia("(prefers-color-scheme: dark)");
function applyTheme(t){document.documentElement.dataset.theme=t;document.documentElement.dataset.dark=mq.matches?"1":"0";$$("#theme button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));try{localStorage.setItem("theme",t)}catch(e){}}
mq.addEventListener("change",()=>applyTheme(document.documentElement.dataset.theme));
$$("#theme button").forEach(b=>b.onclick=()=>applyTheme(b.dataset.t));
let savedTheme="auto";try{savedTheme=localStorage.getItem("theme")||"auto"}catch(e){} applyTheme(savedTheme);

/* ---------- charts ---------- */
function spark(series,w=120,h=28,color="var(--s1)"){const mx=Math.max(1,...series),n=series.length;const pts=series.map((v,i)=>`${(i/(n-1))*(w-4)+2},${h-2-(v/mx)*(h-6)}`).join(" ");return`<svg width="${w}" height="${h}" aria-label="activity, 14 days"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/><circle cx="${w-2}" cy="${h-2-(series[n-1]/mx)*(h-6)}" r="3" fill="${color}" stroke="var(--surface)" stroke-width="1.5"/></svg>`;}
function priceLine(hist){if(hist.length<2)return'<span class="muted small">only one snapshot so far</span>';const W=460,H=110,P=10;const ps=hist.map(h=>h.price),mn=Math.min(...ps),mx=Math.max(...ps);const y=v=>H-P-((v-mn)/(mx-mn||1))*(H-2*P-10),x=i=>P+i*(W-2*P)/(hist.length-1);return`<svg width="${W}" height="${H}" role="img" aria-label="price history"><line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="var(--line)"/><polyline points="${hist.map((h,i)=>`${x(i)},${y(h.price)}`).join(" ")}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round"/>${hist.map((h,i)=>`<circle cx="${x(i)}" cy="${y(h.price)}" r="4" fill="${h.available?"var(--s1)":"var(--s8)"}" stroke="var(--surface)" stroke-width="2"><title>${h.seen_at.slice(0,16).replace("T"," ")} ${inr(h.price)}${h.available?"":" · out of stock"}</title></circle>`).join("")}<text x="${P}" y="${H-1}">${inr(mn)}</text><text x="${W-70}" y="${H-1}">${inr(mx)}</text></svg>`;}
function ring(rows){const W=420,H=284,cx=W/2,cy=H/2,R=112,r0=28,dOf=s=>r0+(1-Math.min(100,Math.max(0,s))/100)*(R-12-r0);
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:480px;display:block;margin:0 auto" role="img" aria-label="threat radar">`;[R,dOf(50),dOf(80)].forEach(r=>g+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--line)"/>`);
  /* angle fixed per brand (alphabetical), distance from P = quietness; overlapping dots are nudged apart sideways */
  const n=rows.length||1,P=[...rows].sort((a,b)=>a.brand.localeCompare(b.brand,undefined,{sensitivity:"base"})).map((r,k)=>({r,a:-Math.PI/2+(k+.5)*2*Math.PI/n,d:dOf(r.score),s:5+Math.min(r.events_7d,30)/7.5}));

function ladderSvg(rows){const pts=rows.filter(r=>r.price);if(!pts.length)return'<div class="empty">No priced products yet.</div>';
  const W=900,L=30,R=30,STEP=13,RAD=5;const mn=Math.min(...pts.map(r=>r.price)),mx=Math.max(...pts.map(r=>r.price));const lx=v=>Math.log10(v),x=v=>L+(lx(v)-lx(mn))/((lx(mx)-lx(mn))||1)*(W-L-R);
  const ticks=[500,1000,2000,3000,5000,10000,20000,30000,40000].filter(t=>t>=mn&&t<=mx);
  // stack dots that collide; chart height follows the tallest stack so dots never run into the label band
  const placed=[];pts.forEach(r=>{const px=x(r.price);let lane=0;while(placed.some(p=>p.lane===lane&&Math.abs(p.x-px)<STEP))lane++;placed.push({r,x:px,lane});});
  const lanes=Math.max(...placed.map(p=>p.lane))+1;
  // Pebble labels: greedy, non-overlapping, in up to 3 rows above the stacks. Anything that does not fit goes to the strip below.
  const clean=n=>n.replace(/^Pebble /,"").replace(/™|®/g,"").replace(/\s*[|(-].*$/,"").trim();
  const mine=pts.filter(r=>r.self).sort((a,b)=>a.price-b.price);const labels=[],rowsUsed=[[],[],[]],seen=new Set();
  mine.forEach(r=>{const name=clean(r.name).slice(0,16);const k=name.toLowerCase()+"|"+Math.round(r.price/100);if(!name||seen.has(k))return;
    const px=x(r.price),w=name.length*6.2+10,x0=Math.max(L,Math.min(W-R-w,px-w/2)),x1=x0+w;
    const row=rowsUsed.findIndex(rw=>rw.every(([a,b])=>x1<a-4||x0>b+4));if(row<0)return;
    rowsUsed[row].push([x0,x1]);seen.add(k);labels.push({name,px,cx:x0+w/2,row});});
  const nRows=labels.length?Math.max(...labels.map(l=>l.row))+1:0;const top=10+nRows*14;const axisY=top+lanes*STEP+18;const H=axisY+28;
  let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="price ladder" style="display:block"><line x1="${L}" x2="${W-R}" y1="${axisY}" y2="${axisY}" stroke="var(--axis)"/>`;
  ticks.forEach(t=>g+=`<line x1="${x(t)}" x2="${x(t)}" y1="${axisY-4}" y2="${axisY+4}" stroke="var(--axis)"/><text x="${x(t)}" y="${axisY+18}" text-anchor="middle">₹${fmt(t)}</text>`);
  placed.forEach(({r,x:px,lane})=>{const cy=axisY-10-lane*STEP;const fill=r.self?"var(--accent)":r.source==="watchlist"?"var(--s2)":"var(--s1)";const hollow=/sold|upcoming|limited|pre/i.test(r.status||"");
    g+=`<g data-tip="${esc(r.brand)} · ${esc(r.name)}\n₹${fmt(r.price)}${r.subscription&&r.subscription!=="None"?" · "+esc(r.subscription)+" subscription":""}${r.status?" · "+esc(r.status):""}${r.evidence?"\nevidence: "+esc(r.evidence):""}"><circle cx="${px}" cy="${cy}" r="${r.self?RAD+1:RAD}" fill="${hollow?"var(--surface)":fill}" stroke="${fill}" stroke-width="2"/></g>`;});
  const stackTop=px=>{const l=placed.filter(p=>Math.abs(p.x-px)<STEP).reduce((m,p)=>Math.max(m,p.lane),0);return axisY-10-l*STEP-RAD-2;};
  labels.forEach(l=>{const ly=top-4-(nRows-1-l.row)*14;g+=`<line x1="${l.px}" x2="${l.px}" y1="${ly+3}" y2="${stackTop(l.px)}" stroke="var(--accent)" stroke-opacity=".35"/><text x="${l.cx}" y="${ly}" text-anchor="middle" style="fill:var(--accent);font-weight:600">${esc(l.name)}</text>`;});
  g+="</svg>";
  // Pebble strip: every own SKU in price order, so nothing is lost when the chart cannot label it
  const strip=mine.map(r=>`<span class="chip" style="border-color:var(--accent);color:var(--accent)" title="${esc(r.name)}">${esc(clean(r.name).slice(0,22))} ₹${fmt(r.price)}</span>`).join("");
  return g+(strip?`<div class="hint" style="margin-top:8px">Pebble on this ladder</div><div>${strip}</div>`:"");}

function bars(rows,o={}){const label=o.label||(r=>r.label),value=o.value||(r=>r.value),fv=o.fmtv||(v=>fmt(v)),color=o.color||(()=>"var(--s1)");const mx=o.max||Math.max(1,...rows.map(value));return rows.map(r=>`<div class="bar"><span title="${esc(label(r))}">${o.link?`<a href="${o.link(r)}">${esc(label(r))}</a>`:esc(label(r))}</span><div class="tr"><div class="f" style="width:${Math.max(1,value(r)/mx*100)}%;background:${color(r)}"></div></div><span class="v">${fv(value(r))}</span></div>`).join("")||'<div class="empty">Nothing yet.</div>';}
function colChart(series,o={}){const w=o.w||380,h=o.h||130,fv=o.fmtv||(v=>fmt(v)),color=o.color||"var(--s1)";if(!series.length)return'<div class="empty">No series yet.</div>';const P=24,n=series.length,bw=Math.min(46,(w-2*P)/n-8);const mx=Math.max(0,...series.map(s=>s.value)),mn=Math.min(0,...series.map(s=>s.value));const y=v=>P+(mx-v)/((mx-mn)||1)*(h-2*P-14);const y0=y(0);
  let g=`<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;display:block" role="img" aria-label="${esc(o.label||"series")}"><line x1="${P}" x2="${w-P}" y1="${y0.toFixed(1)}" y2="${y0.toFixed(1)}" stroke="var(--axis)"/>`;
  series.forEach((s,i)=>{const x=P+(i+.5)*(w-2*P)/n-bw/2,yv=y(s.value),top=Math.min(yv,y0),hh=Math.abs(yv-y0);g+=`<g data-tip="${esc(s.label)}: ${esc(fv(s.value))}${s.conf?" · "+esc(s.conf):""}"><rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,hh).toFixed(1)}" rx="3" fill="${s.value<0?"var(--s8)":s.color||color}" ${s.conf==="estimate"?'fill-opacity=".45"':""}/><text x="${(x+bw/2).toFixed(1)}" y="${h-4}" text-anchor="middle">${esc(s.label)}</text><text x="${(x+bw/2).toFixed(1)}" y="${(top-4).toFixed(1)}" text-anchor="middle" style="fill:var(--ink-2)">${esc(fv(s.value))}</text></g>`;});

  const news_=brands.length?`<div class="grid gauto" style="grid-template-columns:repeat(auto-fill,minmax(340px,1fr))">${brands.map(([b,st])=>`<div class="card"><h2><a href="#/brand/${encodeURIComponent(b)}">${esc(b)}</a> <span class="hint">${st.length} price ${st.length===1?"story":"stories"}</span></h2>${st.slice(0,6).map(s=>storyCard(s,{noBrand:true})).join("")}</div>`).join("")}</div>`
    :'<div class="empty">No price story in the last 30 days. The news collectors tag pricing headlines as they land (every 30 minutes).</div>';
  const ws_=ws.categories&&ws.categories.length?`<div class="card"><h2>White space <span class="hint">competitor SKUs per category × price band</span></h2><table class="heat"><tr><th>Category</th>${ws.bands.map(b=>`<th class="num">₹${b}</th>`).join("")}</tr>${ws.categories.map(c=>`<tr><td>${esc(c)}</td>${ws.bands.map(b=>{const x=ws.cells[c+"|"+b];return x?`<td class="c" style="background:${seqc(x.competitors)}">${x.competitors}</td>`:'<td class="c e">·</td>';}).join("")}</tr>`).join("")}</table></div>`
    :'<div class="empty">No storefront catalogue in this sector, so there is no price ladder to map. Prices come from the news and the watchlist.</div>';
  tabbed(v,[{key:"news",label:"Price moves in the news",html:news_,count:(d.stories||[]).length||null},{key:"whitespace",label:"White space",html:ws_}],{before:kpis});}

/* ---------- Market: size and share, money at stake, then every sector sensor, in tabs ---------- */
async function vMarket(v){head("Market","market size and share of signal · money at stake · demand, creators, apps, complaints, stacks and visuals");
  const [sz,sh,pr,dem,inf,apps,pain,stack,shots]=await Promise.all([api("/api/market/size"),api("/api/market/share"),api("/api/market/pressure?days=30"),api("/api/search_demand"),api("/api/influencers?limit=15"),api("/api/app_health"),api("/api/review_pain_points"),api("/api/techstack"),api("/api/screenshots")]);
  const segs=sz.segments.filter(s=>s.show);
  const cols=["news","search","creator_views","app_ratings","attention"],cn={news:"News",search:"Search",creator_views:"Creators",app_ratings:"App ratings",attention:"Attention"};
  const cell=(r,k)=>`<td class="num" data-tip="${cn[k]}: ${fmt(r[k])} raw · ${r[k+"_idx"]} vs leader"><div class="mini"><div style="width:${r[k+"_idx"]}%;background:${r.self?"var(--accent)":"var(--s1)"}"></div></div><span class="small muted">${r[k+"_idx"]}</span></td>`;
  const kpis=`<div class="kpis">${kpi("Addressable market",`₹${fmt(sz.total_value_cr)}<span class="small muted"> cr/yr</span>`,`India · ${sz.year} · ${sz.segments.length} segments`)}${kpi("Pebble revenue",`₹${fmt(sz.pebble.revenue_cr)}<span class="small muted"> cr</span>`,`${esc(sz.pebble.revenue_period||"")} · ${esc(sz.pebble.revenue_confidence||"estimate")}`)}${kpi("At risk, 30d",cr(pr.total_risk)+"<span class='small muted'>/mo</span>",`${cr(pr.pebble_monthly_revenue)}/mo Pebble revenue`,pr.total_risk?"var(--s8)":"")}${kpi("Upside, 30d",cr(pr.total_upside)+"<span class='small muted'>/mo</span>","rival stock-outs and dry stores",pr.total_upside?"var(--good)":"")}</div>`;
  const size_=`<div class="card"><h2>Market size <span class="hint">India, calendar ${sz.year} · ${sz.sources[0]?esc(sz.sources[0].split(",")[0]):""} · seeds in config/market.yaml</span></h2>
    <div class="grid gauto">${segs.map(s=>`<div class="seg"><div class="row"><b>${esc(s.name)}</b><span class="grow"></span>${confChip(s.confidence==="tracker"?"reported":"estimate")}</div><div class="big">₹${fmt(s.value_cr)} <span class="small muted">cr/yr</span></div><div class="row small ink2" style="gap:12px"><span>${s.units_m} M units</span><span style="color:${sgn(s.growth_pct)}">${pct(s.growth_pct)} YoY</span><span>ASP ₹${fmt(s.asp_inr)}${s.live_median_price?` · live median ₹${fmt(s.live_median_price)}`:""}</span></div>
      <div class="small" style="margin:6px 0">${s.pebble_rank?`<span class="chip" style="border-color:var(--accent);color:var(--accent)">Pebble #${s.pebble_rank}</span>`:""}${s.pebble_share_pct!=null?`<span class="chip">Pebble ~${s.pebble_share_pct}% share</span>`:""}${s.implied_share_pct!=null?`<span class="chip" data-tip="Pebble revenue × segment mix ÷ segment value">implied ${s.implied_share_pct}%</span>`:""}<span class="chip">${s.live_rivals} rivals live</span><span class="chip">${s.live_pebble_skus} Pebble SKUs</span></div>
      <div class="small muted">${esc(s.trend||"")}</div>
      <div style="margin-top:6px">${Object.keys(s.shares||{}).length?bars(Object.entries(s.shares).slice(0,6).map(([b,p])=>({b,p})),{label:r=>r.b,value:r=>r.p,fmtv:v=>v+"%",color:r=>r.b===STATS.self?"var(--accent)":"var(--seq3)",max:Math.max(...Object.values(s.shares),1)}):`<div class="small muted">No company shares here: this is an activity index, not a revenue pool. <a href="#/segment/${esc(s.key)}">Who moves it →</a></div>`}</div></div>`).join("")}</div>
    <div class="small muted" style="margin-top:8px">Shares are the model’s seeds (press coverage of IDC / Counterpoint rankings); the radar never claims tracker precision. Sources: ${sz.sources.map(esc).join(" · ")}</div></div>`;
  const share_=`<div class="card"><h2>Share of signal <span class="hint">each column: brand vs the field leader (=100) · composite weighted</span></h2><table><tr><th>Brand</th>${cols.map(k=>`<th class="num">${cn[k]}</th>`).join("")}<th class="num">Composite</th></tr>${sh.slice(0,16).map(r=>`<tr${r.self?' style="background:color-mix(in srgb,var(--accent) 8%,transparent)"':""}><td><a href="#/brand/${encodeURIComponent(r.brand)}">${esc(r.brand)}</a>${r.origin==="Global"?' <span class="chip">global</span>':""}</td>${cols.map(k=>cell(r,k)).join("")}<td class="num"><b>${r.composite}</b></td></tr>`).join("")}</table><div class="small muted" style="margin-top:8px">News = mentions 30d · Search = autocomplete suggestions naming the brand · Creators = YouTube views on tracked videos · App ratings = Play + App Store rating counts · Attention = Wikipedia page views 30d.</div></div>`;
  const money_=`<div class="card"><h2>Money at stake <span class="hint">₹/month · 30 days · the model’s view of rivals’ moves</span></h2>${pr.top.length?`<table><tr><th>Rival</th><th>Move</th><th class="num">₹/month</th><th>Basis</th></tr>${pr.top.slice(0,12).map(t=>`<tr><td><a href="#/brand/${encodeURIComponent(t.brand)}">${esc(t.brand)}</a><div class="small muted">${esc(kind(t.kind))} · ${ago(t.created_at)}</div></td><td class="small">${esc(t.title.slice(0,80))}</td><td class="num" style="color:${t.direction==="risk"?"var(--s8)":"var(--good)"}">${t.direction==="risk"?"−":"+"}${cr(t.inr_month)}</td><td class="small muted" style="max-width:260px">${esc(t.basis)}</td></tr>`).join("")}</table>`:'<div class="empty">No priced rival move in the window. The model needs Pebble’s revenue and segment mix in config/market.yaml.</div>'}
     <h3 style="margin-top:14px">Risk by segment</h3>${bars(pr.by_segment,{label:r=>r.name,value:r=>r.risk,fmtv:cr,color:()=>"var(--s8)"})}
     <div class="small muted" style="margin-top:8px">How: monthly segment revenue × overlap with the rival × elasticity ${sz.assumptions.price_elasticity} × the price move; launches shift ${sz.assumptions.launch_shift_pct}% of a segment; stock-outs are upside (${sz.assumptions.stockout_capture_pct}% of a rival’s stuck demand). Capped at ${Math.round(sz.assumptions.max_share_at_risk*100)}% of a segment. Every number is an estimate to argue with, not a forecast.</div></div>`;
  const share=Object.entries(dem.brand_share).filter(([b])=>b!=="Sector").slice(0,8),mx=Math.max(1,...share.map(([,c])=>c));const seeds=Object.entries(dem.seeds).filter(([k])=>!STATS.brands.some(b=>k.toLowerCase().startsWith(b.name.toLowerCase())));const seen=new Set();
  const demand_=`<div class="card"><h2>Search demand <span class="hint">Google autocomplete</span></h2>${share.length?share.map(([b,c])=>`<div class="bar"><span>${esc(b)}</span><div class="tr"><div class="f" style="width:${c/mx*100}%"></div></div><span class="v">${c}</span></div>`).join("")+'<div class="legend">suggestions mentioning each brand</div>'+seeds.map(([k,s])=>`<div class="small" style="margin-top:8px"><b>${esc(k)}</b><div class="ink2">${s.slice(0,8).map(x=>esc(x.q)).join(" · ")}</div></div>`).join(""):'<div class="empty">Runs with the 30-minute tier.</div>'}</div>`;
  const creators_=`<div class="card"><h2>Creators <span class="hint">YouTube, by views</span></h2>${inf.length?`<table><tr><th>Channel</th><th class="num">Videos</th><th class="num">Views</th><th>Covers</th></tr>${inf.map(r=>`<tr><td><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.channel)}</a>${r.owned_by?' <span class="pill i0">brand channel</span>':""}${r.covers_pebble?' <span class="pill i0">covers Pebble</span>':""}</td><td class="num">${r.videos}</td><td class="num">${fmt(r.views)}</td><td class="small muted">${Object.entries(r.brands).map(([b,c])=>`${esc(b)}×${c}`).join(", ")}</td></tr>`).join("")}</table>`:'<div class="empty">Runs with the 30-minute tier.</div>'}</div>`;
  const apps_=`<div class="card"><h2>Companion apps <span class="hint">Google Play</span></h2>${apps.length?`<table><tr><th>App</th><th class="num">Rating</th><th class="num">Ratings</th><th class="num">Installs</th><th>Updated</th></tr>${apps.map(a=>`<tr><td>${esc(a.brand)} · ${typeof appLink==="function"?appLink(a):esc(a.name)} <span class="muted small">${typeof appStore==="function"?esc(appStore(a)):""}</span></td><td class="num">${a.rating} <span class="small" style="color:${a.rating_delta<0?"var(--s8)":a.rating_delta>0?"var(--up)":"var(--muted)"}">${a.rating_delta?(a.rating_delta>0?"+":"")+a.rating_delta:""}</span></td><td class="num">${fmt(a.ratings_count)}${a.ratings_gained?` <span class="small muted">+${fmt(a.ratings_gained)}</span>`:""}</td><td class="num">${esc(a.downloads)}</td><td class="small muted">${esc(a.updated_on)}</td></tr>`).join("")}</table>`:'<div class="empty">Runs with the daily tier.</div>'}</div>`;
  const pain_=`<div class="card"><h2>Pain points <span class="hint">themes in rivals' 1-2★ reviews</span></h2>${pain.length?pain.slice(0,10).map(p=>`<div style="padding:8px 0;border-bottom:1px solid var(--line)"><div class="row"><b>${esc(p.brand)}</b><span class="muted small">${p.low_star_reviews} low-star</span></div><div>${Object.entries(p.themes).slice(0,4).map(([t,c])=>`<span class="chip">${esc(t)} ×${c}</span>`).join("")}</div><div class="small muted">“${esc((Object.values(p.examples)[0]||"").slice(0,140))}”</div></div>`).join(""):'<div class="empty">Needs the daily review sweep.</div>'}</div>`;
  const stack_=`<div class="card"><h2>Tech stack <span class="hint">store theme and apps</span></h2>${stack.length?`<table><tr><th>Brand</th><th>Theme</th><th>Apps</th></tr>${stack.map(r=>`<tr><td>${esc(r.brand)}</td><td class="small muted">${esc(r.theme)}</td><td>${r.apps.map(a=>`<span class="chip">${esc(a)}</span>`).join("")}</td></tr>`).join("")}</table>`:'<div class="empty">Runs with the daily tier.</div>'}</div>`;
  const visual_=`<div class="card"><h2>Visual watch <span class="hint">daily homepage screenshots · % changed vs the day before</span></h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(120px,1fr))">${shots.filter(s=>!seen.has(s.brand)&&seen.add(s.brand)).map(s=>`<a class="shot" href="${esc(s.src)}" target="_blank"><img src="${esc(s.src)}" alt="${esc(s.brand)}" loading="lazy"><span>${esc(s.brand)}${s.diff_pct!=null?` · <b style="color:${s.diff_pct>=12?"var(--s2)":"inherit"}">${s.diff_pct}%</b>`:""}</span></a>`).join("")||'<div class="empty">Screenshots arrive with the daily tier.</div>'}</div></div>`;
  tabbed(v,[{key:"size",label:"Size & share",html:`<div class="grid" style="grid-template-columns:1fr">${size_}${share_}</div>`},{key:"money",label:"Money at stake",html:money_,count:pr.top.length||null},{key:"demand",label:"Demand & creators",html:`<div class="grid g2">${demand_}${creators_}</div>`},{key:"apps",label:"Apps & stacks",html:`<div class="grid g2">${apps_}${stack_}</div>`},{key:"complaints",label:"Complaints & visuals",html:`<div class="grid g2">${pain_}${visual_}</div>`}],{before:kpis});}

/* ---------- brand page tabs: News and Financials ---------- */
function brandNews(d){const st=d.stories||[];const att=(d.attention||[]).map(a=>a.views);const pr=(d.pressure||[])[0];
  return`<div class="grid gwide"><div class="card"><h2>Stories <span class="hint">60 days · clustered across outlets</span></h2>${st.map(s=>storyCard(s,{noBrand:true})).join("")||'<div class="empty">No news for this brand yet.</div>'}</div>
  <div style="display:grid;gap:16px;align-content:start"><div class="card"><h2>Attention <span class="hint">Wikipedia views, 30 days</span></h2>${att.length>1?lineChart(att,{l0:d.attention[0].day,l1:d.attention[d.attention.length-1].day}):'<div class="empty">No Wikipedia article configured (companies.yaml → wikipedia).</div>'}</div>
  <div class="card"><h2>Pressure on Pebble <span class="hint">30 days, model</span></h2>${pr?`<div class="big" style="color:var(--s8)">${cr(pr.risk)}<span class="small muted">/mo at risk</span></div><div class="small ink2">upside ${cr(pr.upside)}/mo · ${pr.events} priced moves</div>`:'<div class="empty">No priced move from this brand in 30 days.</div>'}</div>
  <div class="card"><h2>Topics</h2>${(()=>{const c={};st.forEach(s=>c[s.topic]=(c[s.topic]||0)+1);return bars(Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([t,n])=>({t,n})),{label:r=>kind(r.t),value:r=>r.n,color:r=>TCOL[r.t]||"var(--s1)"});})()}</div></div></div>`;}
function brandFinance(d){const p=d.finance||{};const q=p.quote,r=p.revenue,pr=p.profit;const cur=(r||{}).currency||"INR",unit=(r||{}).unit||"crore";const rows=p.rows||[];
  return`<div class="grid g2"><div class="card"><h2>${esc(p.entity||d.brand)} <span class="hint">${esc(p.ownership||"")}${p.hq?" · "+esc(p.hq):""}${p.founded?" · est. "+p.founded:""}</span></h2>
   ${p.notes?`<div class="small ink2" style="margin-bottom:8px">${esc(p.notes)}</div>`:""}<div class="kpis" style="grid-template-columns:repeat(3,1fr)">${kpi("Revenue",r?money(r.value,r.currency,r.unit):"–",r?`${esc(r.period)} · ${CONF[r.confidence]?CONF[r.confidence][0]:r.confidence}`:"no figure yet")}${kpi("Growth",p.revenue_growth_pct!=null?pct(p.revenue_growth_pct):"–","YoY",sgn(p.revenue_growth_pct))}${kpi("Net result",pr?money(pr.signed,pr.currency,pr.unit):"–",pr&&pr.margin_pct!=null?`${pct(pr.margin_pct)} margin`:"",pr?sgn(pr.signed):"")}</div>
   ${typeof fundChips==="function"?fundChips(p.fundamentals):""}<div class="row wrap small" style="margin-top:8px">${p.scale_vs_pebble?`<span class="chip">${p.scale_vs_pebble}× Pebble’s revenue</span>`:""}${p.valuation?`<span class="chip">valued ${money(p.valuation.value,p.valuation.currency,p.valuation.unit)} (${esc(p.valuation.period)})</span>`:""}${p.funding_total?`<span class="chip">raised ${money(p.funding_total.value,p.funding_total.currency,p.funding_total.unit)}</span>`:""}${(p.investors||[]).map(i=>`<span class="chip">${esc(i)}</span>`).join("")}</div>
   <div class="grid g2" style="margin-top:12px"><div><h3>Revenue</h3>${colChart((p.revenue_series||[]).map(s=>({label:s.period,value:s.value,conf:s.confidence})),{w:300,h:120,fmtv:v=>cur==="INR"?fmt(v):money(v,cur,unit)})}</div><div><h3>Net result</h3>${colChart((p.profit_series||[]).map(s=>({label:s.period,value:s.value,conf:s.confidence})),{w:300,h:120,fmtv:v=>cur==="INR"?fmt(v):money(v,cur,unit)})}</div></div>
   <a class="small" href="#/financials/${encodeURIComponent(d.brand)}">full financial profile →</a></div>
  <div style="display:grid;gap:16px;align-content:start">${q?`<div class="card"><h2>Share price <span class="hint">${esc(q.ticker)} · ${esc(q.currency)}</span></h2>${lineChart(q.closes,{l0:"6 months",l1:q.day})}<div class="row small" style="margin-top:4px"><b>${fmt(q.close)}</b><span style="color:${sgn(q.change_pct)}">${pct(q.change_pct)} 1d</span><span style="color:${sgn(q.change_30d_pct)}">${pct(q.change_30d_pct)} 30d</span><span class="muted">52w ${fmt(q.low52)}–${fmt(q.high52)}</span></div></div>`:""}
   <div class="card"><h2>Figures on file</h2><table><tr><th>Metric</th><th>Period</th><th class="num">Value</th><th>Source</th></tr>${rows.slice().reverse().slice(0,14).map(x=>`<tr><td>${esc(kind(x.metric))}</td><td>${esc(x.period)}</td><td class="num">${money(x.value,x.currency,x.unit)}</td><td class="small">${confChip(x.confidence)} ${x.url?`<a class="muted" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.source.slice(0,40))}</a>`:`<span class="muted">${esc(x.source.slice(0,40))}</span>`}</td></tr>`).join("")||'<tr><td colspan=4 class="muted">Nothing on file. Seed figures in config/companies.yaml; the daily financials sweep adds filings and press figures.</td></tr>'}</table></div>
   <div class="card"><h2>Money news</h2>${(p.money_events||[]).concat(p.news||[]).slice(0,8).map(e=>`<div class="small" style="padding:5px 0;border-bottom:1px solid var(--line)"><span class="muted">${ago(e.created_at)}</span> <a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a></div>`).join("")||'<div class="empty">None yet.</div>'}</div></div></div>`;}

render().then(connect);
</script>
