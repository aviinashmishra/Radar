# Nazar sector: E-commerce & D2C (ecom). Same schema as config/competitors.yaml (the IoT radar), read by the radar package
# with RADAR_CONFIG pointing here. No brand is marked `self: true`, so the analysis is written for a neutral reader
# competing in the sector (set `self: true` on a brand, or `perspective:`, to change whose seat it is written from).
# `vocab` tunes news relevance and scoring (radar/relevance.py, radar/enrich.py); `voice_themes` the review themes;
# `world` is shown on the Nazar directory. Edit freely: the radar re-reads this file on restart.

