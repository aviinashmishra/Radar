# Nazar sector: AI & SaaS. Market model: size, growth and shares per segment (all flagged estimates), and the
# assumptions of the impact model. There is no `self:` block because no brand is marked self; add one
# (revenue_cr, revenue_period, segment_mix_pct) to turn events into rupees at risk for a specific company.

year: 2025
sources:
- Company filings (SEC, NSE)
- Press reporting of private-company revenue run-rates and valuations
- Nasscom and IDC India AI spend estimates
- IndiaAI Mission disclosures
segments:
  frontier:
    name: Frontier model revenue (global)
    units_m: 1000
    growth_pct: 150
    asp_inr: 2500
    value_cr: 250000
    trend: OpenAI, Anthropic and Google take almost all paid model revenue; open weights (Llama, DeepSeek, Qwen) set the price floor.
    confidence: estimate
    shares_pct:
      OpenAI: 45
      Anthropic: 20
      Google: 18
      xAI: 3
      Mistral AI: 1
      Cohere: 1
      DeepSeek: 1
  apps:
    name: Consumer AI apps (India users, weighted)
    units_m: 350
    growth_pct: 90
    asp_inr: 150
    value_cr: 5250
    trend: ChatGPT leads; Gemini bundled into Android and Jio; Perplexity via Airtel; Meta AI inside WhatsApp.
