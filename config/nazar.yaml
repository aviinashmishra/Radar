# Nazar: the registry of sectors. Each sector is a full radar (its own config folder, database and schedule) that the
# Nazar hub loads side by side and reads together. `primary` marks the sector whose Telegram bot and Shopify sales run;
# `snapshot` names the file the cloud worker publishes on the `data` release. Add a sector by copying a folder under
# config/sectors/ and listing it here.

name: Nazar
tagline: One eye on every market. Nazar runs one radar per sector and reads them together.
sectors:
- key: iot
  label: IoT & Smart Gadgets
  short: IoT
  icon: ⌚
  color: '#2a78d6'
  tagline: 'Pebble''s home turf: screenless bands, smart rings, smartwatches, earbuds, speakers'
  config: config/competitors.yaml
  db: data/radar.db
  snapshot: radar.db.gz
  primary: true
- key: auto
  label: Automotive & EV
  short: Auto
  icon: 🚗
  color: '#e34948'
  tagline: Cars, EVs, two-wheelers, ride-hailing and the charging that powers them
  config: config/sectors/auto/competitors.yaml
  db: data/sectors/auto/radar.db
  snapshot: auto.db.gz
  primary: false
