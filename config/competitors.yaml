# Sector-wide searches (not tied to a brand). Catch new entrants, category trends and launches.
sector_news_terms:
  - "screenless fitness band India"
  - "smart ring India launch"
  - "smartwatch launch India"
  - "TWS earbuds launch India"
  - "wearables India IDC"
  - "D2C electronics India funding"
  - "Bluetooth speaker launch India"

# Reddit communities and search phrases that surface buzz, complaints and unmet needs.
reddit:
  subreddits: ["IndianGaming", "india", "gadgets", "smartwatch", "Earbuds", "whoop", "ouraring"]
  searches: ["boAt", "Noise smartwatch", "Fire-Boltt", "Pebble smartwatch", "Boult", "screenless band", "smart ring India"]

# Product categories and price bands for the white-space map (INR).
price_bands: [0, 1000, 2000, 3000, 5000, 8000, 15000, 1000000]

# YouTube search sensor: each brand is searched with these suffixes, newest uploads first.
youtube_queries: ["new launch", "unboxing review"]

# Search-demand radar: Google autocomplete seeds. {brand} expands to every brand name.
search_seeds:
  - "{brand} "
  - "{brand} new"
  - "best smartwatch under"
  - "best earbuds under"
  - "best smart ring"
  - "screenless fitness band"
  - "smartwatch with"
  - "earbuds with"
  - "smart ring"
  - "whoop alternative"

# Daily homepage screenshots + visual diff (needs: pip install playwright && python -m playwright install chromium)
screenshots: true
