# Pebble Competitor Radar - who and what we watch.
# Every entry is a brand. `self: true` marks Pebble itself so the same pipeline benchmarks you vs them.
# `shopify` is the storefront root (the public /products.json, /collections.json and sitemap are polled).
# `watch_pages` are any public pages whose text we snapshot and diff (careers, press, offers, landing pages).
# `news_terms` are extra Google News search phrases on top of the brand name.
# `segments` tags the brand's product segments (keys from `segments:` below); `origin` Indian | Global;
# `tier` core | adjacent (global premium brands watched for pricing and launches, not SKU by SKU).
# Curated products with sheet data live in watchlist.yaml.

sector: "Indian consumer electronics D2C: screenless smart bands, smart rings, smartwatches, TWS earbuds, speakers, chargers"
currency: "INR"

# Cloud mode: the GitHub repo whose Actions run the collectors and whose `data` release holds the database
# snapshot the Vercel dashboard reads. RADAR_REPO in the environment overrides it (e.g. for a fork).
cloud_repo: "aviinashmishra/Radar"

# Product segments. `keywords` is a regex matched against product type + title to place Shopify SKUs.
segments:
  - { key: band,       name: "Smart bands (screenless)", show: true,  keywords: "screenless|smart band|health band|fitness band|fitness tracker|\\bband\\b|qore|\\bflex\\b|\\barc\\b|\\bloop\\b|cirqa|whoop|helio strap|\\brep\\b|fitbit air" }
  - { key: ring,       name: "Smart rings",              show: true,  keywords: "smart ring|\\bring\\b" }
  - { key: watch,      name: "Smartwatches",             show: true,  keywords: "smart ?watch|\\bwatch\\b" }
  - { key: earbuds,    name: "TWS earbuds",              show: true,  keywords: "\\btws\\b|earbud|\\bbuds?\\b|dockets|airdopes|true wireless|earpods" }
  - { key: neckband,   name: "Neckbands",                show: false, keywords: "neckband|bassheads" }
  - { key: headphones, name: "Headphones",               show: false, keywords: "headphone|on-?ear|over-?ear" }
  - { key: speaker,    name: "Speakers",                 show: true,  keywords: "speaker|soundbar|\\bstone\\b|party" }
  - { key: powerbank,  name: "Power banks",              show: false, keywords: "power ?bank" }
  - { key: charger,    name: "Chargers & cables",        show: false, keywords: "charger|cable|adapter|\\bgan\\b" }

# Indian sale calendar. The signal engine uses it to label sale-start behaviour and warn early.
festivals:
  - { name: "Republic Day sales", month: 1, day: 20 }
  - { name: "Valentine's Day", month: 2, day: 7 }
  - { name: "Holi sales", month: 3, day: 10 }
  - { name: "Independence Day sales", month: 8, day: 10 }
  - { name: "Navratri / Big Billion & Great Indian Festival", month: 9, day: 20 }
  - { name: "Dussehra", month: 10, day: 1 }
  - { name: "Diwali / Dhanteras", month: 10, day: 15 }
  - { name: "Black Friday / Cyber Monday", month: 11, day: 24 }
  - { name: "Christmas / New Year", month: 12, day: 20 }

brands:
  - name: Pebble
    self: true
    shopify: https://www.pebblecart.com
    segments: [band, ring, watch, earbuds, speaker, charger]
    news_terms: ["Pebble smartwatch India", "Pebblecart", "Pebble Qore"]
    watch_pages:
      - https://www.pebblecart.com/pages/about-us
    apps: ["com.mensa.pebble"]          # companion app on Google Play (check this is the right one)

  # ---------------- Indian mass-market rivals (full catalogue tracking) ----------------
