# Who is behind every brand on the radar, and what the radar should read about their money.
#
# One entry per brand name in competitors.yaml. Everything is optional.
#   entity       legal name of the operating company          ownership   private | listed | subsidiary | brand-licence
#   ticker       Yahoo Finance symbol for a listed parent (TITAN.NS, GRMN, 005930.KS): daily quote, 1-day / 30-day moves,
#                52-week position; a move of 5% or more in a day becomes a `stock_move` event
#   sec_cik      SEC EDGAR central index key for US-listed parents: revenue / profit per fiscal year straight from
#                the XBRL filings (authoritative, no key; EDGAR wants a contact in the user agent: SEC_CONTACT in .env)
#   wikipedia    English Wikipedia article: daily page views = public attention index (`attention_spike` events)
#   ios          Apple App Store ids of the companion apps (rating, rating count, version, release date)
#   investors    lead investors / strategic backers, for context on the Financials page
#   financials   seeded figures from public reporting. Each row: metric, period, value, currency, unit, source, confidence.
#                The financials collector adds rows it extracts from news (revenue, profit, loss, funding, valuation
#                with ₹ crore / $ million amounts) and from EDGAR, each with its source URL, so seeded rows are only a
#                starting point. confidence: filing | reported | estimate   (estimates are shown as such: edit or
#                delete them once you have a better number).
#   metrics:     revenue | net_profit | net_loss | ebitda | valuation | funding_round | funding_total | market_cap
#   currency:    INR values are in crore (1 crore = 10 million); USD / EUR / KRW values are in million.

